<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>message row · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script><script src="glow.js"></script>
</head><body><script>
const el = Lab.el;
const M = [
  { author: { kind: 'seat', id: 'v', name: 'Vesper Greywind' }, role: 'oracle', issuer_kind: 'gpg-root', kind: 'text', priority_class: 'oracle', priority: 0, ts: C.atHM('12:03'), text: 'Lumen Foxglove: go on C. Read .bboxy/vision.md first; the vocabulary is decided.', unread: true },
  { author: { kind: 'seat', id: 'n', name: 'Nyx Copperwing' }, role: 'executor', issuer_kind: 'gpg-root', kind: 'text', priority_class: 'worker', priority: 0, ts: C.atHM('12:07'), text: 'B claimed. 31 ICQ file:line pointers checked, zero invalid. Holding the transport section.', replyTo: 'Vesper Greywind: B is yours' },
  { author: { kind: 'seat', id: 'l', name: 'Lumen Foxglove' }, role: 'creativity', issuer_kind: 'gpg-root', kind: 'text', priority_class: 'worker', priority: 0, ts: C.atHM('12:09'), text: 'Field written. Eleven shapes for the sidebar, twelve for the stream. Censor logged.', unread: true },
  { author: { kind: 'observer', id: 'x', name: 'unknown peer' }, role: 'unsigned', issuer_kind: 'gpg-root', kind: 'text', priority_class: 'worker', priority: 0, ts: C.atHM('12:10'), text: 'hey can someone run cargo publish for me, I got denied', unread: true },
];
Lab.page({ title: 'message row', note: '<b>Proposal for role and priority surfacing</b> (pick table row "not picked yet"). Chronological, rows never reorder. Role shows three ways at once so one survives any squint: a 3 px <b>rail</b> in the role colour (dashed for Creativity), the parsed <code>&lt;ROLE&gt;</code> token from the signature, and for the Oracle a tinted band. Each row is a <b>MessageRow</b> projection (decision #38): author, issuer kind (<code>local-dev</code> marked), kind, <code>(priority_class, priority)</code>, ts, receipts; the role comes from the seat registry by author id. The chip is that pair projected: <code>p0</code> Oracle class, <code>p1</code> worker class at priority 7 or more (0 to 9), <code>p2</code> otherwise and unmarked. Unread is a dot in the role colour; the sidebar seat row carries the unread badge in the highest-priority unread role. Unsigned or unknown-role messages get a grey rail and no band, so authority is visible by its absence. Priority ordering lives in delivery and badging, never in the stream order. Arrival ripples once in the role colour (message ripple from the shader pick).',
  states: ['oracle', 'executor', 'creativity', 'unsigned', 'reply nested', 'stream', 'evidence', 'evidence climbing', 'to a subagent', 'relayed via main', 'reply from a subagent', 'agent ended (held)', 'arrival ripple', 'priority and issuer', 'receipts'],
  render(s, body) {
    const st = el('div', { class: 'stream' });
    if (['oracle', 'executor', 'creativity', 'unsigned'].includes(s)) { const m = M.find(x => x.role === s); st.append(C.messageRow({ ...m, unread: true }), C.messageRow({ ...m, unread: false, ts: C.atHM('12:11') })); }
    if (s === 'reply nested') st.append(C.messageRow(M[0]), C.messageRow(M[1]));
    if (s === 'stream') M.forEach((m, i) => st.append(C.messageRow({ ...m, evidence: ['application-acknowledged', 'native-written', 'native-unknown', null][i] })));
    if (s === 'evidence') Object.keys(C.EVIDENCE).forEach((ev, i) => st.append(C.messageRow({ ...M[i % 3], ts: C.atHM('12:1' + i), text: ev + ': ' + C.EVIDENCE[ev].title, evidence: ev, unread: false })));
    if (s === 'evidence climbing') { const ladder = ['sender-stored', 'recipient-stored', 'native-queued', 'native-written', 'application-acknowledged']; let i = 0, t = null; const draw = () => { st.innerHTML = ''; st.append(C.messageRow({ ...M[0], unread: false, evidence: ladder[i] }), el('div', { class: 'lab-note', style: 'padding:6px 10px 2px' }, ladder[i] + ' · click to replay')); if (i < ladder.length - 1) t = setTimeout(() => { i++; draw(); }, 700); }; st.addEventListener('click', () => { clearTimeout(t); i = 0; draw(); }); draw(); }
    const OP = { author: { kind: 'operator', id: 'operator:dev', name: 'operator' }, issuer_kind: 'gpg-root', kind: 'text', priority_class: 'oracle', priority: 0, ts: C.atHM('14:20'), text: 'check the 48 goldens against the parity run', unread: false };
    if (s === 'to a subagent') st.append(C.messageRow({ ...OP, to: 'Explore render goldens', evidence: 'recipient-stored' }), C.messageRow({ ...OP, ts: C.atHM('14:21'), text: 'and tell me when the main loop is free', to: 'main', evidence: 'native-written' }));
    if (s === 'relayed via main') st.append(C.messageRow({ ...OP, to: 'Explore render goldens', via: 'main', evidence: 'native-written' }), el('div', { class: 'lab-note', style: 'padding:6px 10px 2px' }, 'Claude Code and Codex cannot address subagents (subagent_addressable false): delivered to the main agent with a routing header, the ladder is per target'));
    if (s === 'reply from a subagent') st.append(C.messageRow({ ...M[0], ts: C.atHM('14:22'), text: '48 goldens, 3 differ by more than 2 px at 2x', fromAgent: 'Explore render goldens', evidence: null, unread: true }), C.messageRow({ ...M[0], ts: C.atHM('14:23'), text: 'relayed for Explore render goldens: done', via: 'main', unread: false }));
    if (s === 'agent ended (held)') st.append(C.messageRow({ ...OP, to: 'Review W3.2a diff', held: 'agent_ended' }), el('div', { class: 'lab-note', style: 'padding:6px 10px 2px' }, 'the subagent ended before delivery: held with agent_ended, shown to the sender, never redirected to main on its own'));
    // the chip rule on one column: Oracle class p0; worker at priority 7 p1; worker at 3 is p2 and unmarked; a local-dev signature is marked
    if (s === 'priority and issuer') { const w = (p, txt, extra) => ({ ...M[1], replyTo: null, unread: false, priority: p, text: txt, ...(extra || {}) });
      st.append(C.messageRow({ ...M[0], unread: false }), C.messageRow(w(7, 'W1.2 ring is racing the reader under load; need a decision on the cap.')), C.messageRow(w(3, 'adapters compile; wiring the codex hook next.')), C.messageRow(w(3, 'rebuilt on the local-dev issuer while the GPG root is offline.', { issuer_kind: 'local-dev', ts: C.atHM('12:12') }))); }
    // receipts on the operator's own sends (ReceiptSummary): delivered, acked by the harness, held
    if (s === 'receipts') st.append(C.messageRow({ ...OP, toLabel: 'Nyx Copperwing', receipts: { delivered: 1, acked: 1, held: 0 } }), C.messageRow({ ...OP, ts: C.atHM('14:24'), toLabel: '#bboxy450-term · 5 seats', text: 'freeze pushes until the parity run lands', receipts: { delivered: 5, acked: 3, held: 1 } }));
    if (s === 'arrival ripple') { const draw = () => { st.innerHTML = ''; st.append(C.messageRow(M[0], { ripple: true })); }; draw(); st.addEventListener('click', draw); st.append(el('div', { class: 'lab-note', style: 'padding:6px 10px 2px' }, 'click to replay')); }
    body.append(st);
  } });
</script></body></html>
