<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>launcher · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script>
</head><body><script>
const el = Lab.el;
const model = C.makeModel(10, 'launcher');
const sp = model.spaces[0], seats = model.spaces.flatMap(x => x.tabs.flatMap(t => t.seats || C.leaves(t.tree)));
const tabOf = key => { for (const s of model.spaces) for (const t of s.tabs) if ((t.seats || C.leaves(t.tree)).some(x => x.key === key)) return { sp: s, t }; return null; };
const anchorSeat = seats[0];
const Q = { 'root': '', 'typed "co"': 'co', 'typed "ssh rig cod"': 'ssh rig cod', 'Claude ▸ placements': ['claude'], 'SSH ▸ machines': ['ssh'], 'SSH ▸ rig ▸ harnesses': ['ssh', 'ssh:rig'], 'SSH ▸ rig ▸ Codex ▸ placements': ['ssh', 'ssh:rig', 'ssh:rig:codex'], 'Cloud ▸ regions': ['cloud'], 'Go to ▸ seats and swarms': ['goto'], 'Settings ▸ sections': ['settings'], 'Resume ▸ recently closed': ['resume'], 'preset · split right': '', 'preset · split down': '', 'cap reached': '' };
Lab.page({ title: 'launcher', wide: true, note: '⌘T. One panel to launch, place and go. Every nesting level: launchables ▸ placements; SSH ▸ machine ▸ harness ▸ placement; Cloud ▸ region ▸ harness ▸ placement; Go to ▸ every seat and swarm; Graph; Settings ▸ section. Typing flattens ("ssh rig cod"). Presets (⌘↵ split right, ⌘⇧↵ split down) show the real layout with the new cell lit. Same launcherItems() and picker() as the showcase.',
  states: Object.keys(Q),
  render(s, body) {
    const back = el('div', { class: 'spot-back', style: 'position:relative;inset:auto;z-index:auto;min-height:560px;border-radius:var(--r-pill);padding-top:28px' });
    const preset = s === 'preset · split right' ? 'right' : s === 'preset · split down' ? 'bottom' : null;
    if (preset) {
      const ghost = { key: '__new', name: 'new seat', state: 'idle' };
      const tree = { dir: preset === 'right' ? 'v' : 'h', ratio: 0.5, a: anchorSeat, b: ghost };
      back.append(el('div', { class: 'spot-banner' }, C.miniGrid(tree, '__new', true), el('div', { class: 'txt' }, el('div', { class: 'big' }, preset === 'right' ? 'Split right' : 'Split down'), el('div', { class: 'of' }, 'of ', el('b', { style: 'color:' + C.seatColor(anchorSeat) }, anchorSeat.name), ' · the new seat lands in the lit cell'))));
    }
    const retained = [{ seat: { key: 'old1', name: 'Marlo Pike', harness: 'claude', role: 'executor' }, closedAt: '13:12', session: '5f3a91c2' }, { seat: { key: 'old2', name: 'Tess Varga', harness: 'codex', role: 'executor' }, closedAt: '12:40', session: '0c7e22ab' }, { seat: { key: 'old3', name: 'zsh', harness: 'zsh', role: null }, closedAt: '11:58', session: '-' }];
    const items = C.launcherItems({ seats, spaces: model.spaces, sp, anchorSeat, tabOf, retained });
    const cap = s === 'cap reached' ? { scope: 'swarm', name: sp.name, used: 8, limit: 8, counts: '6 running · 1 starting · 1 in grace' } : null;
    const ph = preset ? 'split ' + (preset === 'right' ? 'right of ' : 'below ') + anchorSeat.name + ' · pick a harness' : 'launch or go to · type to search';
    const pk = C.picker({ items, query: Array.isArray(Q[s]) ? '' : Q[s], path: Array.isArray(Q[s]) ? Q[s] : null, placeholder: ph, cap, onPick: (it, name) => console.log('pick', it.id, name), onClose: () => {} });
    back.append(pk); body.append(back);
  } });
</script></body></html>
