<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>close · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script><script src="glow.js"></script>
</head><body><script>
const el = Lab.el;
// the 'gone' notice (T7 ruling, c13b0ba5): one presence line in the swarm's stream dock, exactly '<name> closed; its history is kept';
// nothing is deleted and ⌘Z is no longer offered for it
const GONE = seat => el('div', { class: 'stream-dock' }, C.messageRow({ kind: 'presence', text: seat.name + ' closed; its history is kept', ts: C.atHM('14:31') }));
function t7(phase) {
  const S = (k, name, harness, role, state) => ({ key: k, name, harness, role, state, title: { codex: 'messaging spec', claude: 'swarm control', zsh: '~' }[harness] });
  const a = S('t1', 'Vesper Greywind', 'claude', 'oracle', 'active'), b = S('t2', 'Nyx Copperwing', 'codex', 'executor', 'idle'), victim = S('cv', 'Tamsin Voss', 'codex', 'executor', 'active');
  const full = { dir: 'v', ratio: .5, a, b: { dir: 'h', ratio: .5, a: b, b: victim } }, without = { dir: 'v', ratio: .5, a, b };
  const tree = phase === 'open' || phase === 'undone' ? full : without, seats = phase === 'open' || phase === 'undone' ? [a, b, victim] : [a, b];
  const focus = phase === 'undone' || phase === 'open' ? victim : a;
  const sp = { key: 'term', name: 'term', tabs: [{ name: 'main', shortcut: '⌘1', tree, seats }],
    closed: phase === 'in grace' ? [{ seat: victim, closedAt: Date.now() - 8000, graceMs: 60000 }] : [] };
  const frame = el('div', { style: 'height:560px;display:flex;border:var(--hair-w) solid var(--line);border-radius:var(--r-pill);overflow:hidden' });
  const sb = C.sidebar({ spaces: [sp] }, { openSpaces: ['term'], openTabs: ['term/main'], focusedKey: focus.key, onUndo: () => {}, onNewSpace: () => {} });
  sb.style.width = '280px'; sb.style.flex = 'none';
  if (phase === 'gone') sb.append(GONE(victim));   // the stream says so: the swarm dock at the sidebar's foot
  const v = C.splitView(tree, { paneOpts: t => ({ focused: t.key === focus.key, unfocused: t.key !== focus.key, shortcut: '⌘' + (seats.indexOf(t) + 1) }) });
  frame.append(sb, el('div', { class: 'stage tiled', style: 'flex:1;display:flex;min-width:0' }, (v.style.flex = '1', v)));
  const say = { open: 'Before: three panes; the red dot in Tamsin Voss’s strip closes it.', 'in grace': 'Closed 8 s ago: the pane left the split and its neighbour took the room; the strip in the swarm counts down 52 s and offers undo ⌘Z; the process still runs.',
    undone: '⌘Z within grace: the same process back in its split position, focused (the focus swell plays); no new generation.', gone: 'After 60 s: the pane and its row have left and one stream line says so; nothing is deleted (the ring and records stay reachable from the seat’s record and the Graph tab) and ⌘Z is no longer offered for it.' }[phase];
  return el('div', {}, frame, el('div', { class: 'lab-note', style: 'padding-top:8px' }, say));
}
Lab.page({ title: 'close', wide: true, note: 'Closing is reversible and has no confirm (vision: undo close). The red dot in the strip closes; the seat collapses into a closed strip in its swarm while the process keeps running for the grace window (60 s, setting); the hairline drains; ⌘Z or undo restores it in place, same process, same split. After grace it is retained: history and the session mapping stay, and ⌘T Resume brings it back as a new process. Purge (row menu) is the only confirm and skips grace.',
  states: ['in grace', 'two in grace', 'almost expired', 'after grace · retained', 'T7 · open', 'T7 · in grace', 'T7 · undone', 'T7 · gone'],
  render(s, body) {
    // e2e promise T7 (spec #258): the whole window. Close takes the pane out of the split (its neighbours take the room) and puts the
    // seat in a closed strip in its swarm: seconds left, a draining hairline, undo ⌘Z (ux-flow 'close puts the seat in a 60 s grace').
    // Undo restores the same process in its split position, focused. After grace the strip goes and the stream says so.
    if (s.startsWith('T7')) { body.append(t7(s.slice(5))); return; }
    const model = C.makeModel(10, 'close'), sp = model.spaces[0], victim = { key: 'cv', name: 'Tamsin Voss', harness: 'codex', role: 'executor', state: 'active' };
    const now = Date.now();
    if (s === 'in grace') sp.closed = [{ seat: victim, closedAt: now - 8000, graceMs: 60000 }];
    if (s === 'two in grace') sp.closed = [{ seat: victim, closedAt: now - 8000, graceMs: 60000 }, { seat: { key: 'zz', name: 'zsh', harness: 'zsh' }, closedAt: now - 30000, graceMs: 60000 }];
    if (s === 'almost expired') sp.closed = [{ seat: victim, closedAt: now - 54000, graceMs: 60000 }];
    const frame = el('div', { class: 'sb-frame', style: 'height:600px' });
    const stage = el('div', { class: 'stage', style: 'display:block;padding:14px' });
    if (s === 'after grace · retained') {
      stage.append(el('div', { class: 'lab-note' }, 'the launcher then lists it under Resume ▸ (see launcher.html?state=resume-recently-closed)'));
    } else stage.append(el('div', { class: 'lab-note' }, 'undo ⌘Z restores the same live process at its recorded split position; no new process generation'));
    const sb = C.sidebar(model, { openSpaces: [sp.key], focusedKey: sp.tabs[0].seats[0].key, allSpaces: true, onUndo: c => { sp.closed = sp.closed.filter(x => x !== c); frame.replaceWith(frame); } });
    if (s === 'after grace · retained') sb.append(GONE(victim));   // the stream line was set but never drawn: the dock draws it now
    frame.append(sb, stage);
    body.append(frame);
  } });
</script></body></html>
