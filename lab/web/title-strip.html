<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>title strip + border · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script><script src="glow.js"></script>
</head><body><script>
const el = Lab.el;
const seat = (st, i) => ({ key: 'pane' + (i || 0), name: ['Vesper Greywind', 'Nyx Copperwing', 'Lumen Foxglove'][i || 0], harness: ['claude', 'codex', 'claude'][i || 0], role: ['oracle', 'executor', 'creativity'][i || 0], title: ['gpu research', 'messaging spec', 'ux divergence'][i || 0], state: st });
Lab.page({ title: 'title strip + border', wide: true, note: 'Full-width ' + TOKENS.strip.height + ' px strip in the seat colour, same icon · ROLE · first name · title · ⌘N · glyph as the sidebar row. The role stays visible and the full canonical name remains in its tooltip. Border glow per the operator spec: idle very mild static, active pulsating, waiting pulsating amber at 1 Hz, errored static red, focused brighter at every state. The dots along the edge are a canvas fake of the particle emitter; the real one is a wgpu shader. Count and speed scale with activity.',
  states: ['idle', 'active', 'waiting', 'errored', 'focused vs unfocused', 'row + pane breathe together', 'three seats, one focused', 'stop · operator', 'interrupt sent', 'worker view', 'authority · revoked'],
  render(s, body) {
    const stage = el('div', { style: 'background:var(--navy);padding:28px;border-radius:var(--r-pill)' });
    const withParticles = (sd, opts) => { const w = el('div', { class: 'pane-wrap' }, C.pane(sd, opts)); requestAnimationFrame(() => Glow.attach(w, sd, opts)); return w; };
    if (C.STATES.includes(s)) { stage.style.display = 'grid'; stage.style.gridTemplateColumns = '1fr 1fr'; stage.style.gap = '28px'; stage.append(withParticles(seat(s, 0), { focused: true, shortcut: '⌘1' }), withParticles(seat(s, 1), { focused: false, unfocused: true, shortcut: '⌘2' })); body.append(el('div', { class: 'lab-note', style: 'padding:0 0 8px' }, 'left: focused · right: unfocused (dim: saturate ' + TOKENS.dim.saturate + ', opacity ' + TOKENS.dim.opacity + ')')); }
    if (s === 'focused vs unfocused') { stage.style.display = 'grid'; stage.style.gridTemplateColumns = 'repeat(4, 1fr)'; stage.style.gap = '20px'; for (const st of C.STATES) stage.append(withParticles(seat(st, 0), { focused: true })); for (const st of C.STATES) stage.append(withParticles(seat(st, 1), { unfocused: true })); }
    if (s === 'row + pane breathe together') { stage.style.display = 'grid'; stage.style.gridTemplateColumns = '220px 1fr'; stage.style.gap = '28px'; stage.style.alignItems = 'start'; const col = el('div', { style: 'display:flex;flex-direction:column;gap:6px;background:var(--bg);padding:8px;border-radius:var(--r-row)' }); const panes = el('div', { style: 'display:grid;gap:28px' }); C.STATES.forEach((st, i) => { const sd = seat(st, i % 3); sd.key = 'br' + i; col.append(C.seatRow(sd, { focused: i === 1, shortcut: '⌘' + (i + 1) })); panes.append(withParticles(sd, { focused: i === 1, shortcut: '⌘' + (i + 1), height: 110 })); }); stage.append(col, panes); }
    if (s === 'three seats, one focused') { stage.style.display = 'grid'; stage.style.gridTemplateColumns = '1fr 1fr'; stage.style.gridTemplateRows = '1fr 1fr'; stage.style.gap = '28px'; const a = withParticles(seat('active', 0), { focused: true, shortcut: '⌘1' }); a.style.gridRow = '1 / 3'; stage.append(a, withParticles(seat('waiting', 1), { unfocused: true, shortcut: '⌘2' }), withParticles(seat('idle', 2), { unfocused: true, shortcut: '⌘3' })); }
    if (s === 'stop · operator' || s === 'interrupt sent' || s === 'worker view') { stage.style.display = 'grid'; stage.style.gridTemplateColumns = '1fr 1fr'; stage.style.gap = '28px';
      const sent = s === 'interrupt sent', worker = s === 'worker view';
      const a = seat('active', 0), b = seat('waiting', 1); if (sent) a.interruptSent = true;
      const o = (sd, f) => ({ focused: f, unfocused: !f, shortcut: '⌘1', onMute: () => {}, ...(worker ? {} : { onInterrupt: sd2 => { sd2.interruptSent = true; stage.replaceChildren(withParticles(a, o(a, true)), withParticles(b, o(b, false))); } }) });
      stage.append(withParticles(a, o(a, true)), withParticles(b, o(b, false)));
      body.append(el('div', { class: 'lab-note' }, worker ? 'a worker-class viewer gets no stop glyph' : sent ? 'one-shot: red sweep along the strip, "interrupt sent" fades after 3 s; the state does not change until the seat reports' : 'the square stop glyph sits before the mute toggle; click it'));
    }
    if (s === 'authority · revoked') { stage.style.display = 'grid'; stage.style.gridTemplateColumns = '1fr 1fr'; stage.style.gap = '28px'; stage.append(withParticles({ ...seat('active', 0), authority: 'revoked' }, { focused: true, shortcut: '⌘1', onMute: () => {} }), withParticles({ ...seat('idle', 1), authority: 'expired' }, { unfocused: true, shortcut: '⌘2', onMute: () => {} })); }
    body.append(stage);
  } });
</script></body></html>
