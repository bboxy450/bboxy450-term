<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>settings · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script><script src="glow.js"></script>
</head><body><script>
const el = Lab.el;
Lab.page({ title: 'settings', wide: true, note: 'Opens as a tab (⌘, or Settings in the launcher). Left nav, cards in the design-system material. Account (sign-in, root key, devices), Cloud providers, SSH machines, Roles with default system prompts and send permissions, Harnesses, Plugins (trust, tier, contract, health, the call and hook timeline, the slow-hook warning), Knowledge (roots and their provider, swappable, no file moves), Appearance, Notifications (on by default, only in the background, per harness; off greys the rest; a muted seat never notifies), Shortcuts. Rows that differ from config.toml get the dot and a reset. Read-mostly: values shown, edits are local to the demo.',
  states: ['Account', 'custody · held', 'custody · unlock pending', 'custody · cancelled', 'custody · unknown', 'custody · granted', 'custody · signer returned', 'Cloud', 'Machines', 'Roles', 'Harnesses', 'new harness', 'Appearance', 'Notifications', 'notifications · off', 'notifications · one harness off', 'Messaging', 'messaging · oracle', 'messaging · overridden', 'messaging · muted', 'Plugins', 'plugins · trust pending', 'plugins · enable pending', 'plugins · refused', 'Knowledge', 'knowledge · swapped to the stub', 'knowledge · swap pending', 'knowledge · swap refused', 'Shortcuts', 'in a tab'],
  render(s, body) {
    if (s === 'in a tab') {
      const model = C.makeModel(10, 'phone');
      const gearSeat = { key: 'settings', name: 'settings', harness: 'gear', role: null, title: '', state: 'idle', color: TOKENS.color.dark.accent };
      model.spaces[0].tabs.push({ name: 'settings', shortcut: '⌘,', tree: gearSeat, seats: [gearSeat] });
      const frame = el('div', { class: 'sb-frame', style: 'height:640px' });
      const pane = el('div', { class: 'pane focused', style: '--seat:' + TOKENS.color.dark.accent + ';height:100%' }, C.titleStrip(gearSeat, { shortcut: '⌘,' }), C.settingsPage({ section: 'Roles' }));
      frame.append(C.sidebar(model, { openSpaces: [model.spaces[0].key], focusedKey: 'settings', allSpaces: true }), el('div', { class: 'stage', style: 'display:block' }, pane));
      body.append(frame); return;
    }
    const frame = el('div', { style: 'height:' + (s === 'Plugins' || /^plugins · /.test(s) ? 1180 : 640) + 'px;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden' });   // Plugins: every card in view
    const draft = s === 'new harness' ? { name: 'aider', command: 'aider --model sonnet', ci: 7, icon: 'zsh', role: 'executor', wake: 'pty', stateFrom: 'output cadence', hooks: false } : null;
    // notifications states pass their own values, so the page's other states keep the defaults
    const nv = s === 'notifications · off' ? { enabled: false, only_when_not_frontmost: true, disabled_harnesses: ['codex'] } : s === 'notifications · one harness off' ? { enabled: true, only_when_not_frontmost: false, disabled_harnesses: ['codex'] } : null;
    // messaging states (messaging-attention §3, MA-8): role defaults, one override with its reset, and the operator's mute over a policy
    const MS = { 'Messaging': C.SET.messaging,
      'messaging · oracle': { seat: { name: 'Vesper', role: 'oracle' }, channels: ['#bboxy450-term'], rules: [], deferred: null, muted: false },
      'messaging · overridden': { seat: { name: 'Wren Thistledown', role: 'creativity' }, channels: ['#bboxy450-term', '#bboxy450-crates'], rules: [{ destination: '#bboxy450-term', class: 'conversation', mode: 'digest' }], deferred: { n: 3, at: '14:40' }, muted: false },
      'messaging · muted': { seat: { name: 'Sable Embertail', role: 'executor' }, channels: ['#bboxy450-term', '#bboxy450-crates'], rules: [], deferred: { n: 7, at: '14:30' }, muted: true } }, mv = MS[s] || null;
    // plugin intent states (P-1 Settings binding): pending keeps the observed value; a refusal names its reason
    const plState = s => { const pl = JSON.parse(JSON.stringify(C.SET.plugins)), at = n => pl.find(p => p.name.endsWith(n));
      if (s === 'plugins · trust pending') at('repo_graph-ctags').pending = { verb: 'trust' };
      if (s === 'plugins · enable pending') at('event_sink-otel').pending = { verb: 'disable' };
      if (s === 'plugins · refused') Object.assign(at('data_source-obsidian'), { enabled: false, refused: { verb: 'enable', reason: 'contract_failed · resolve #N (no numbers in a vault)' } });
      return pl; }, pl = /^plugins · /.test(s) ? plState(s) : null;
    // custody states (#280, #315): the native Keychain path; a hold names itself and its two exits, then the outcome of one attempt
    const CUS = { 'custody · held': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' } },
      'custody · unlock pending': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' }, attempt: 'pending' },
      'custody · cancelled': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' }, attempt: 'cancelled' },
      'custody · unknown': { tier: 'keychain', acl: 'unknown', hold: { reason: 'Keychain interaction required' }, attempt: 'unknown', op: 'op-7f3a91c2' },
      'custody · granted': { tier: 'keychain', acl: 'unknown', hold: { reason: 'Keychain interaction required' }, attempt: 'granted', op: 'op-7f3a91c2' },
      'custody · signer returned': { tier: 'keychain', acl: 'designated', hold: null, attempt: 'returned', op: 'op-7f3a91c2' } }, cu = CUS[s] || null;
    // knowledge · swapped: the same root read by the stub provider over stdio; every record digest identical, no file moved
    // a swap in flight keeps the bundled provider answering; a refused swap stays on it and says why
    const knRoot = { name: '.bboxy', path: '~/mydev/bboxy450-term/.bboxy', provider: 'bboxy450-term-data_source-bboxy', records: 418, answering: 'logic · in process' };
    const knMore = s === 'knowledge · swap pending' ? { pending: { to: 'bboxy450-term-data_source-stub' } }
      : s === 'knowledge · swap refused' ? { refused: 'swap to bboxy450-term-data_source-stub refused · conformance: fetch returned a different digest for 1 of 418 records; still answered by the bundled provider' } : null;
    const kn = knMore ? { roots: [{ ...knRoot, ...knMore }], offered: C.SET.knowledge.offered } : s === 'knowledge · swapped to the stub' ? { roots: [{ name: '.bboxy', path: '~/mydev/bboxy450-term/.bboxy', provider: 'bboxy450-term-data_source-stub', records: 418, answering: 'bboxy450-term-data_source-stub · pid 4312, over stdio', digests: '418 of 418 record digests identical, no file moved' }], offered: C.SET.knowledge.offered } : null;
    frame.append(C.settingsPage({ section: draft ? 'Harnesses' : pl ? 'Plugins' : nv ? 'Notifications' : mv ? 'Messaging' : cu ? 'Account' : kn ? 'Knowledge' : s, draftHarness: draft, notifications: nv, custody: cu, knowledge: kn, messaging: mv, plugins: pl })); body.append(frame);
  } });
</script></body></html>
