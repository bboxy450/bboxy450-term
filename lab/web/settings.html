<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>settings · bboxy450-term lab</title>
<link rel="stylesheet" href="lab.css">
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script><script src="glow.js"></script>
</head><body><script>
const el = Lab.el;
Lab.page({ title: 'settings', wide: true, note: 'Opens as a tab (⌘, or Settings in the launcher). Left nav, cards in the design-system material. Account (sign-in, root key, devices), Cloud providers, SSH machines, Roles with default system prompts and send permissions, Harnesses, Appearance, Notifications (on by default, only in the background, per harness; off greys the rest; a muted seat never notifies), Shortcuts. Rows that differ from config.toml get the dot and a reset. Read-mostly: values shown, edits are local to the demo.',
  states: ['Account', 'custody · held', 'custody · unlock pending', 'custody · cancelled', 'custody · unknown', 'custody · granted', 'custody · signer returned', 'Cloud', 'Machines', 'Roles', 'Harnesses', 'new harness', 'Appearance', 'Notifications', 'notifications · off', 'notifications · one harness off', 'Shortcuts', 'in a tab'],
  render(s, body) {
    if (s === 'in a tab') {
      const model = C.makeModel(10, 'phone');
      const gearSeat = { key: 'settings', name: 'settings', harness: 'gear', role: null, title: '', state: 'idle', color: TOKENS.color.dark.accent };
      model.spaces[0].tabs.push({ name: 'settings', shortcut: '⌘,', tree: gearSeat, seats: [gearSeat] });
      const frame = el('div', { class: 'sb-frame', style: 'height:640px' });
      const pane = el('div', { class: 'pane focused', style: '--seat:' + TOKENS.color.dark.accent + ';height:100%' }, C.titleStrip(gearSeat, { shortcut: '⌘,' }), C.settingsPage({ section: 'Roles' }));
      frame.append(C.sidebar(model, { openSpaces: [model.spaces[0].key], focusedKey: 'settings', allSpaces: true }), el('div', { class: 'stage', style: 'display:block' }, pane));
      body.append(frame); return;
    }
    const frame = el('div', { style: 'height:640px;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden' });
    const draft = s === 'new harness' ? { name: 'aider', command: 'aider --model sonnet', ci: 7, icon: 'zsh', role: 'executor', wake: 'pty', stateFrom: 'output cadence', hooks: false } : null;
    // notifications states pass their own values, so the page's other states keep the defaults
    const nv = s === 'notifications · off' ? { enabled: false, only_when_not_frontmost: true, disabled_harnesses: ['codex'] } : s === 'notifications · one harness off' ? { enabled: true, only_when_not_frontmost: false, disabled_harnesses: ['codex'] } : null;
    // custody states (#280, #315): the native Keychain path; a hold names itself and its two exits, then the outcome of one attempt
    const CUS = { 'custody · held': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' } },
      'custody · unlock pending': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' }, attempt: 'pending' },
      'custody · cancelled': { tier: 'keychain', acl: 'legacy', hold: { reason: 'Keychain interaction required' }, attempt: 'cancelled' },
      'custody · unknown': { tier: 'keychain', acl: 'unknown', hold: { reason: 'Keychain interaction required' }, attempt: 'unknown', op: 'op-7f3a91c2' },
      'custody · granted': { tier: 'keychain', acl: 'unknown', hold: { reason: 'Keychain interaction required' }, attempt: 'granted', op: 'op-7f3a91c2' },
      'custody · signer returned': { tier: 'keychain', acl: 'designated', hold: null, attempt: 'returned', op: 'op-7f3a91c2' } }, cu = CUS[s] || null;
    frame.append(C.settingsPage({ section: draft ? 'Harnesses' : nv ? 'Notifications' : cu ? 'Account' : s, draftHarness: draft, notifications: nv, custody: cu })); body.append(frame);
  } });
</script></body></html>
