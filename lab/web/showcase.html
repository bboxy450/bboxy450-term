<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bboxy450-term · showcase</title>
<link rel="stylesheet" href="lab.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0B0B10; }
  #glow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  .titlebar { border-radius: 0; border-left: 0; border-right: 0; border-top: 0; background: rgba(18,20,42,.6); backdrop-filter: blur(8px); flex: none; }
  .titlebar .logo { width: 18px; height: 18px; }
  #main { flex: 1; display: flex; min-height: 0; }
  /* the shader is the only glow here: kill the CSS fake and let the canvas show through */
  .sidebar, .space, .pane, .seat-row { box-shadow: none !important; animation: none !important; }
  .sidebar { background: transparent; border-right: 1px solid rgba(42,47,85,.6); }
  .space { background: rgba(18,20,42,.55); }
  .seat-row.waiting, .seat-row.errored { background: transparent; }
  .seat-row.focused { background: rgba(27,31,63,.8); }
  .stage { flex: 1; display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr; gap: 28px; padding: 28px; background: transparent; }
  .stage .pane { background: #0B0B10; }
  .stage .pane:first-child { grid-row: 1 / 3; }
  .pane .term { font-size: 12px; }
  .pane.unfocused { filter: none; }
  .pane.unfocused .term, .pane.unfocused .strip { opacity: .82; }
  .hint { position: fixed; right: 14px; bottom: 10px; z-index: 2; font-size: 11px; color: #8A90B0; font-family: var(--font-mono); opacity: .7; }
  .hint b { color: #F2EEE6; font-weight: 500; }
</style>
<script src="tokens.js"></script><script src="lab.js"></script><script src="components.js"></script>
</head><body>
<canvas id="glow"></canvas>
<div id="app"></div>
<div class="hint" id="hint"></div>
<script src="showcase.js"></script>
</body></html>
