<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bboxy450-term · showcase</title>
<link rel="stylesheet" href="lab.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  #glow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; display: block; pointer-events: none; }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  .titlebar { border-radius: 0; border-left: 0; border-right: 0; border-top: 0; background: color-mix(in srgb, var(--surface) 70%, transparent); backdrop-filter: blur(8px); flex: none; }
  .titlebar .logo { width: 18px; height: 18px; }
  #main { flex: 1; display: flex; min-height: 0; }
  /* the shader is the only glow here: kill the CSS fake and let the canvas show through */
  .sidebar, .space, .pane, .seat-row { box-shadow: none !important; animation: none !important; }
  .sidebar { background: transparent; border-right: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .seat-row.waiting, .seat-row.errored { background: transparent; }
  .stage { flex: 1; padding: 0; background: transparent; min-width: 0; }
  .split { display: flex; gap: var(--gutter); min-width: 0; min-height: 0; }
  .split.v { flex-direction: row; } .split.h { flex-direction: column; }
  .stage .pane { background: var(--bg); min-height: 0; min-width: 0; border-radius: 0; }
  .sidebar { padding-left: var(--gutter); }
  .sidebar .sb-scroll { padding: 0 var(--gutter) 0 0; }
  .space { margin: var(--gutter) 0; }
  .pane .term { font-size: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .pane .term .lines { white-space: pre; overflow: hidden; }
  .stream-dock { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); padding: 4px var(--gutter) 4px 0; max-height: 38%; overflow: auto; font-size: 11px; }
  .stream-dock .msg { font-size: 11px; padding: 3px 14px 3px 0; gap: 6px; }
  .stream-dock .msg .head { font-size: 10px; }
  .stream-dock .msg .text { margin-top: 0; }
  .stream-dock .msg.unread::after { width: 5px; height: 5px; top: 6px; right: 4px; }
  .stream-dock .filter { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--fg-dim); padding: 0 0 4px 6px; font-family: var(--font-mono); }
  .stream-dock .filter b { color: var(--fg); font-weight: 500; }
  .stream-dock .filter button { background: transparent; border: 1px solid var(--line); color: var(--fg-dim); border-radius: 999px; font: inherit; font-size: 10px; padding: 0 6px; cursor: pointer; }
  .tbtn.theme { font-family: var(--font-mono); font-size: 11px; gap: 6px; align-items: center; }
</style>
<script src="tokens.js"></script><script src="logs.js"></script><script src="lab.js"></script><script src="components.js"></script>
</head><body>
<canvas id="glow"></canvas>
<div id="app"></div>
<script src="showcase.js"></script>
</body></html>
