# One compiler on this machine for every worktree, gate and harness: latest stable.
# `rustup update stable` moves everyone at once; keep `rust-version` in Cargo.toml <= it.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
profile = "minimal"
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "x86_64-unknown-linux-gnu",
]
