[workspace]
resolver = "3"
members = [
  "crates/bboxy450-usage",
  "crates/bboxy450-term-desktop-core",
  "crates/bboxy450-term-desktop-macos",
  "crates/bboxy450-term-desktop",
  "crates/bboxy450-keychain-macos",
  "crates/bboxy450-keychain-windows",
  "crates/bboxy450-keychain-file",
  "crates/bboxy450-keychain",
  "crates/bboxy450-desktop-notifications-macos",
  "crates/bboxy450-desktop-notifications-windows",
  "crates/bboxy450-desktop-notifications-linux",
  "crates/bboxy450-desktop-notifications",
  "crates/bbt-plugin",
  "crates/bbt-plugin-sdk",
  "crates/bbt-plugin-fixture",
  "plugins/gitkb",
  "crates/bboxy450-tlc",
  "crates/bbt-yarn-macros",
  "crates/bbt-yarn",
  "crates/bbt-core",
  "crates/bboxy450-harness-wake-up",
  "crates/bbt-mermaid",
  "crates/bbt-supervisor",
  "crates/bbt-mux",
  "crates/bbt-proto",
  "crates/bbt-rt",
  "crates/bbt-render",
  "crates/bbt-ui-model",
  "crates/bbt-ui",
  "crates/bbt-doc",
  "crates/bboxybook",
  "crates/bboxy450-term",
  "crates/bboxy450-harness",
  "crates/bboxy-firehose",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/bboxy450/bboxy450-term"
authors = ["Boxy <bboxy450@gmail.com>"]
rust-version = "1.99"

[workspace.dependencies]
bboxy450-harness-wake-up = { package = "bboxy450-harness-wake-up", version = "0.1.1", path = "crates/bboxy450-harness-wake-up" }
bbt-core = { package = "bboxy450-term-core", version = "0.1.1", path = "crates/bbt-core" }
bbt-supervisor = { package = "bboxy450-harness-host", version = "0.1.1", path = "crates/bbt-supervisor" }
bbt-mux = { package = "bboxy450-term-mux", version = "0.1.1", path = "crates/bbt-mux" }
bbt-proto = { package = "bboxy450-term-proto", version = "0.1.1", path = "crates/bbt-proto" }
bbt-render = { package = "bboxy450-render", version = "0.1.1", path = "crates/bbt-render" }
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "crates/bbt-ui-model" }

# The embedded harness uses this checkout; its standalone manifest stays intact.
[patch.crates-io]
bboxy450-rt = { path = "crates/bbt-rt" }
bboxy450-yarn = { path = "crates/bbt-yarn" }
bboxy450-tlc = { path = "crates/bboxy450-tlc" }
bboxy450-ui = { path = "crates/bbt-ui" }
bboxy450-doc = { path = "crates/bbt-doc" }
bboxy450-ui-core = { path = "crates/bbt-ui-model" }
bboxy450-render = { path = "crates/bbt-render" }

bboxy450-term-desktop-core = { path = "crates/bboxy450-term-desktop-core" }
bboxy450-term-desktop = { path = "crates/bboxy450-term-desktop" }
bboxy450-term-desktop-macos = { path = "crates/bboxy450-term-desktop-macos" }

# Private Dream C1 performance fixtures retain every assertion and overflow check.
# Decision: d93377961364684-dream-c1-optimized-private-fixture.
[profile.dream-c1-fixture]
inherits = "release"
debug-assertions = true
overflow-checks = true
