# bboxy450-term design tokens. Single source for the web lab and the Rust build.
# Colours are sRGB hex. Sizes are CSS px at 1x. Durations are ms.
# Picked in .kb/ux-pick.md; palette lifted from ~/.agents/identity/bboxy.png.

[meta]
version = 1
brand_tilt_deg = -12          # logo gesture: 12 degrees counter-clockwise

[font]
chrome = "ui-sans-serif, -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
mono = "ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace"

[color.dark]
bg = "#0B0B10"                # hoodie
surface = "#12142A"           # sidebar pill fill
surface_2 = "#1B1F3F"         # hover / elevated
line = "#2A2F55"              # hairlines
fg = "#F2EEE6"                # cream
fg_dim = "#8A90B0"            # muted text
accent = "#2E6BFF"            # electric
accent_soft = "#7B8CFF"       # periwinkle
navy = "#141A3C"

[color.light]
bg = "#F4F3FF"
surface = "#FFFFFF"
surface_2 = "#ECEAFF"
line = "#D6D4F0"
fg = "#141A3C"
fg_dim = "#6B7190"
accent = "#2E6BFF"
accent_soft = "#7B8CFF"
navy = "#141A3C"

[color.state]
idle = "#6B7190"
waiting = "#FFB454"
errored = "#FF4D5E"
# active = the seat colour

[color.role]
oracle = "#FFC53D"
executor = "#2E6BFF"
creativity = "#B07BFF"
unsigned = "#6B7190"

[seat_color]
# hash(seat key) -> hue; fixed saturation and lightness so every seat reads on dark and light
saturation = 72
lightness_dark = 62
lightness_light = 46
hue_steps = 24                # quantise so neighbours differ by at least 15 degrees

[density.touch]
row_h = 44
tab_h = 40
glyph = 16
icon = 20
font = 15
font_small = 13
pad_x = 14
gap = 8

[density.comfortable]
row_h = 28
tab_h = 26
glyph = 12
icon = 16
font = 13
font_small = 11
pad_x = 10
gap = 6

[density.compact]
row_h = 20
tab_h = 18
glyph = 10
icon = 12
font = 12
font_small = 10
pad_x = 8
gap = 4

[radius]
pill = 12
row = 6
chip = 4
grid = 3

[sidebar]
width = 260
width_compact = 220
minigrid_w = 24
minigrid_h = 16
collapse_glyphs = 6           # rolled-up glyphs shown per collapsed row before the ellipsis

[strip]
height = 22
border_idle = 1
border_active = 2

[glow]
# Border glow spec (.kb/ux-pick.md): particle glow in the seat colour, four readings, one shader.
pane_radius = 14              # px, blur radius at the pane border
row_radius = 6                # px, same glow on the sidebar row, reduced
idle_alpha = 0.12             # idle / done: very mild, static
active_alpha_min = 0.25       # active: pulsates between min and max
active_alpha_max = 0.70
active_pulse_ms = 1800        # breathing rate for active
waiting_alpha_min = 0.25      # waiting: pulsates amber at motion.pulse_ms (1 Hz)
waiting_alpha_max = 0.80
errored_alpha = 0.45          # errored: static, red tint
focused_boost = 1.6           # focused multiplies alpha at every state (clamped to 1)
particles_idle = 6            # emitter count per pane, scales with activity
particles_active = 40
particle_speed = 18           # px per second along the border
particle_size = 2.2           # px

[motion]
pulse_ms = 1000               # waiting-on-input, 1 Hz
ripple_ms = 400
hover_ms = 120
vignette_alpha = 0.10
