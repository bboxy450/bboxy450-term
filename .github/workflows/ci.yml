name: ci
# Local CI only during heavy development (operator, 2026-10-22): run scripts/ci-local.sh.
# GitHub runs only on manual dispatch until crates are open-sourced into public repos.
on: [workflow_dispatch]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: make test-formal
      - run: sh scripts/layering.sh
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Detect parity inputs
        id: parity
        shell: bash
        run: |
          parity_base="$(python3 -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); print(e.get("pull_request",{}).get("base",{}).get("sha") or e.get("before") or "")')"
          if [ -z "$parity_base" ] || [ "$parity_base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$parity_base" HEAD | rg '^(crates/(bboxybook|bbt-ui-model|bbt-render)/|lab/web/|design/|scripts/parity.sh)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Web and native component parity
        if: steps.parity.outputs.run == 'true'
        run: sh scripts/parity.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bboxybook-parity
          path: target/parity
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render
          path: target/render
          if-no-files-found: ignore
