name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render
          path: target/render
          if-no-files-found: ignore
