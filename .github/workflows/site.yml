#
# Deploy https://bboxy450.lol (Worker bboxy450-site, site/wrangler.jsonc) whenever
# the site or the showcase files it copies change on main. Operator request
# 2026-11-01: auto-deploy instead of a manual `npx wrangler deploy`.
# site/build.sh only copies committed files (site/real.js is generated locally by
# site/refresh.sh from sanitized, reviewed sessions and committed), so CI needs no
# local session data. Secret: CLOUDFLARE_API_TOKEN (Workers Scripts edit + the
# zone's Workers routes). Variable: CLOUDFLARE_ACCOUNT_ID.
name: site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "lab/web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
concurrency:
  group: site-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh site/build.sh
      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.148.0 deploy
      - name: Verify live
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://bboxy450.lol/)
          echo "bboxy450.lol -> $code"
          test "$code" = 200
