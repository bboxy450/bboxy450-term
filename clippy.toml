# Shared UI policy. clippy::disallowed_methods is warn-by-default; the UI check
# uses -D clippy::disallowed_methods. IO crates allow it locally where guarded.
# Clippy requires concrete paths, not std::fs::* / std::process::* globs.
disallowed-methods = [
  { path = "std::fs::read", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::read_to_string", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::write", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::read_dir", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::metadata", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::symlink_metadata", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::canonicalize", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::read_link", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::create_dir", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::create_dir_all", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::remove_file", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::remove_dir", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::remove_dir_all", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::rename", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::copy", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::hard_link", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::set_permissions", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::File::open", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::File::create", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::File::create_new", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::OpenOptions::open", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::File::sync_all", reason = "UI must use bbt-rt for IO" },
  { path = "std::fs::File::sync_data", reason = "UI must use bbt-rt for IO" },
  { path = "std::process::Command::spawn", reason = "use bbt_rt::spawn_command" },
  { path = "std::process::Command::status", reason = "use bbt_rt::spawn_command" },
  { path = "std::process::Command::output", reason = "use bbt_rt::spawn_command" },
  { path = "std::process::Child::wait", reason = "UI must not wait for processes" },
  { path = "std::process::Child::wait_with_output", reason = "UI must not wait for processes" },
  { path = "std::thread::sleep", reason = "UI must not sleep" },
  { path = "std::sync::mpsc::Receiver::recv", reason = "UI must use try_recv" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "UI must use try_recv" },
  { path = "std::sync::mpsc::SyncSender::send", reason = "UI must use try_send" },
  { path = "std::sync::Mutex::lock", reason = "UI must use try_lock" },
  { path = "std::sync::RwLock::read", reason = "UI must use try_read" },
  { path = "std::sync::RwLock::write", reason = "UI must use try_write" },
  { path = "tokio::runtime::Handle::block_on", reason = "UI must spawn onto bbt-rt", allow-invalid = true },
  { path = "tokio::runtime::Runtime::block_on", reason = "UI must spawn onto bbt-rt", allow-invalid = true },
  { path = "pollster::block_on", reason = "UI must not block on async IO", allow-invalid = true },
]
