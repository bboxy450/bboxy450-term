# cargo-nextest: the workspace test runner for every crate (make test, make land).
# Each test runs in its own process; binaries run concurrently instead of one by one.
# https://nexte.st/docs/configuration/reference/
[profile.default]
# One shared, CPU-bound machine: real PTY/app fixtures keep fixed wall-clock deadlines.
# Override per run with NEXTEST_TEST_THREADS.
test-threads = 2
fail-fast = false
# A hung test is killed after 5 minutes instead of eating the whole run bound.
slow-timeout = { period = "60s", terminate-after = 5 }
# Other swarms load this machine, so a fixed deadline can miss once. Each failing
# test reruns once; a pass on retry is reported FLAKY, a second failure fails.
retries = 1
status-level = "fail"
final-status-level = "flaky"

[profile.default.junit]
path = "junit.xml"

# The full gate only (scripts/ci-local.sh sets NEXTEST_PROFILE=gate for the workspace
# suite). `make land` and every other run keep the default profile above.
[test-groups]
# Wall-clock and CPU budgets: one at a time.
timed = { max-threads = 1 }
# Integration binaries drive real PTYs, sockets and app fixtures: two at once, as before.
fixtures = { max-threads = 2 }

[profile.gate]
test-threads = 6

[profile.gate.junit]
path = "junit.xml"

# The measurement inventory of scripts/qos-policy.py (LAND.md, "Explicit default-QoS
# measurements"). Generated: python3 -I scripts/qos-policy.py --nextest-filter
[[profile.gate.overrides]]
filter = 'binary(/^(capture_fairness|dream_c1|dream_read|dream_replay|formal_contracts|gates_seats|gui_budget|idle_cpu|input_latency)$/) | (binary(=it) & test(/^(capture_fairness|dream_c1|dream_read|dream_replay|formal_contracts|gates_seats|gui_budget|idle_cpu|input_latency)::/)) | test(/(^|::)(actual_private_control_invalid_ulids_and_unsafe_revision_emit_no_new_frame|actual_private_prepared_start_is_one_write_and_duplicate_closes_without_replay|actual_private_process_clears_authority_environment_and_uses_fixed_argv|actual_private_process_rejects_blank_invalid_utf8_unknown_duplicate_and_oversized_frames|custody_copies_exact_ir_and_only_typed_blob_carriers_into_private_new_inodes|dream_c1_actual_control_routes_reject_expired_public_grant_without_credentials|dream_c1_admitted_mcp_is_exact_own_seat_and_reports_honest_missing_runs|dream_c1_collection_growth_reserves_old_overlap_and_preserves_resource_limit|dream_c1_concurrent_register_original_operation_wins_before_candidate_source_key|dream_c1_cooperative_preparation_preserves_cumulative_cost_and_paid_phase_maxima|dream_c1_delete_catalogue_cold_init_commit_close_preserves_original_operation|dream_c1_dense_value_success_and_later_error_scope_retirement_are_paced|dream_c1_final_actual_authority_held_clock_cpu_refusals_keep_owned_child|dream_c1_final_actual_authority_rechecks_row_head_grant_inode_aba_after_debt|dream_c1_final_public_control_is_once_after_debt_and_retains_component_child_on_refusal|dream_c1_held_private_delete_catalogue_keeps_mcp_gui_control_owner_independent|dream_c1_held_provider_refuses_ordinary_mcp_and_gui_read_admission|dream_c1_held_provider_selection_refuses_actual_page_owner_before_next_unit|dream_c1_held_provider_selection_refuses_real_mcp_gui_controls_within_250ms|dream_c1_held_provider_suppresses_actual_successful_ordinary_gui_completion|dream_c1_legacy_wal_transition_preserves_rows_and_busy_reader_never_changes_custody|dream_c1_native_buffer_free_is_measured_and_retains_reservation_through_cancel|dream_c1_partial_serde_value_after_mid_reader_stop_has_owned_paced_collections|dream_c1_private_signed_gated_worker_held_parent_paid_probe_and_refusals|dream_c1_registration_commits_close_cursor_original_op_and_source_key_once_after_reopen|dream_c1_rejected_owned_results_drain_before_credit_for_cpu_clock_cancel_deadline|dream_c1_schema_bootstrap_busy_writer_refuses_without_waiting_or_partial_publication|dream_c1_source_error_capacity_is_atomic_across_real_sqlite_owners|dream_c1_source_failure_is_bounded_immutable_and_fenced_before_any_replay|dream_c1_tiny_json_combines_scan_decode_work_and_reuses_complex_fallback|dream_c1_tiny_json_error_and_cpu_verdict_keep_owned_cleanup|dream_c1_typed_descriptor_and_nested_episode_partial_collections_retire_before_error|dream_c1_withheld_returned_effect_retains_lease_and_independent_cached_controls|dream_public_prepared_session_releases_transaction_and_lock_between_fresh_units|dream_read_actual_admitted_empty_cold_lesson_foreign_and_bad_requests|dream_read_actual_admitted_row_pins_context_tamper_and_currentness|dream_read_actual_inflight_snapshot_invalidation_refuses_old_page|dream_read_actual_row_binding_kind_fabricated_origin_and_member_controls|dream_read_process_native_admitted_discovery_and_cold_reads_start_no_job|dream_read_two_session_cluster_episode_origins_and_honest_pagination|eof_and_drop_retain_exact_child_custody_through_actual_reap|exit_events_at_machine_scale|final_output_and_exit_reach_the_owner|million_messages_per_second_never_wait_for_a_consumer|ring_capture_throughput_with_logic_running_and_stopped|ring_capture_twenty_mib_profile_running_and_stopped|ring_cold_replay_twenty_mib_profile|ring_seals_twenty_mib_with_logic_stopped_and_a_stalled_notification_queue_then_replays_without_gap)$/) | test(/cpu_profile|dream::c1::|dream::read::helper_tests::|gpu::streaming_tests::|lazy_projection_tests::input_frame_cpu_profile|logic::dream_public_api_tests::|logic::idle_command_tests|logic::ring_batch_tests|registry::dream_c1::registry_tests::|repeated_text_frame_cpu_profile|rich_faces::budget_verification::rich_four_view_aggregate_budget|rich_native_parity_and_composition_microbench|seat_socket::gui_tests::busy_gui_poll_and_locked_cursor_keep_the_session_and_queued_events|seat_socket::input_check_tests/) | (binary_id(/^bboxy450-harness-host/) & test(/^(client|transport)::tests::/))'
test-group = 'timed'

[[profile.gate.overrides]]
filter = 'kind(test)'
test-group = 'fixtures'
