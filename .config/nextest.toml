# cargo-nextest: the workspace test runner for every crate (make test, make land).
# Each test runs in its own process; binaries run concurrently instead of one by one.
# https://nexte.st/docs/configuration/reference/
[profile.default]
# One shared, CPU-bound machine: real PTY/app fixtures keep fixed wall-clock deadlines.
# Override per run with NEXTEST_TEST_THREADS.
test-threads = 2
fail-fast = false
# A hung test is killed after 5 minutes instead of eating the whole run bound.
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "fail"
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"
