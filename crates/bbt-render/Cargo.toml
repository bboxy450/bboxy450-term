[package]
readme = "README.md"
name = "bboxy450-render"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Retained GPU rendering, terminal text shaping and compositor primitives"

[dependencies]
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "../bbt-ui-model" }
bytemuck = { version = "1.25", features = ["derive"] }
lyon_tessellation = "=1.0.22"
png = "0.18"
pollster = "0.4"
resvg = { version = "=0.48.1", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"

[dev-dependencies]
bbt-core.workspace = true
bboxy-firehose = { package = "bboxy450-term-firehose", version = "0.1.1", path = "../bboxy-firehose" }
serde_json = "1"

[lib]
name = "bbt_render"
