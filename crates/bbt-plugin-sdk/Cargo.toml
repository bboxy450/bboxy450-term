[package]
readme = "README.md"
name = "bboxy450-term-plugin-sdk"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Build bboxy450-term plugins in Rust: stdio MCP runtime, shape, skills and a test client"

[dependencies]
bbt-plugin = { package = "bboxy450-plugin", version = "0.1.1", path = "../bbt-plugin" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bboxy450-tlc = { version = "0.1.1", path = "../bboxy450-tlc", optional = true }

[features]
# The shipped runtime model (models/PluginRuntime.tla) as a bboxy450-tlc builder.
model = ["dep:bboxy450-tlc"]

[lib]
name = "bbt_plugin_sdk"

[dev-dependencies]
sha2 = "0.10"
