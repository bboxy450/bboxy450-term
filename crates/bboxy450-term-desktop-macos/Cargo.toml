[package]
name = "bboxy450-term-desktop-macos"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Native AppKit desktop backend for bboxy450-term"

[dependencies]
bboxy450-term-desktop-core = { version = "0.1.1", path = "../bboxy450-term-desktop-core" }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSRunLoop", "NSDate", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSView", "NSWindow", "NSScreen", "objc2-core-foundation"] }
