[package]
readme = "README.md"
name = "bboxy450-ui"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "bboxy450-term: token-resolved UI styles and components"

[dependencies]
bboxy450-canvas = { version = "0.1.1", path = "../bboxy450-canvas" }
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "../bbt-ui-model" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bbt-render = { workspace = true }
png = "0.18"
bbt-rt = { package = "bboxy450-rt", version = "0.1.1", path = "../bbt-rt" }
serde_json = "1"

[lib]
name = "bbt_ui"
