[package]
readme = "README.md"
name = "bboxy450-term-mux"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local terminal sessions, durable messaging and knowledge-provider coordination"

[dependencies]
bboxy450-keychain = { package = "bboxy450-keychain", version = "0.1.1", path = "../bboxy450-keychain" }
bboxy450-harness-wake-up = { workspace = true, features = ["runtime-assertions"] }
bbt-plugin = { package = "bboxy450-plugin", version = "0.1.1", path = "../bbt-plugin" }
bbt-doc = { package = "bboxy450-doc", version = "0.1.1", path = "../bbt-doc" }
bbt-proto = { package = "bboxy450-term-proto", version = "0.1.1", path = "../bbt-proto" }
bbt-core = { package = "bboxy450-term-core", version = "0.1.1", path = "../bbt-core" }
bbt-rt = { package = "bboxy450-rt", version = "0.1.1", path = "../bbt-rt" }
bbt-supervisor = { package = "bboxy450-harness-host", version = "0.1.1", path = "../bbt-supervisor" }
base64 = "0.22"
ed25519-dalek = "3.0"
getrandom = "0.3"
hkdf = "=0.12.4"
jsonschema = { version = "=0.60.1", default-features = false }
libc = "0.2"
notify = "8.2"
petgraph = "0.8"
pgp = { version = "=0.21.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros", "process"] }
ulid = { version = "1", features = ["serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"

[dev-dependencies]
bbt-plugin-fixture = { package = "bboxy450-term-plugin-fixture", path = "../bbt-plugin-fixture" }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lib]
name = "bbt_mux"
