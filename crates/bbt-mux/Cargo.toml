[package]
name = "bbt-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "bboxy450-term: bbt-mux"

[dependencies]
bbt-core = { path = "../bbt-core" }
bbt-rt = { path = "../bbt-rt" }
base64 = "0.22"
ed25519-dalek = "3.0"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
portable-pty = "=0.9.0"
notify = "8.2"
petgraph = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
ulid = { version = "1", features = ["serde"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
