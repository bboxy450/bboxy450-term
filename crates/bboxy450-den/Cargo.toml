[package]
name = "bboxy450-den"
description = "Parser and bounded soundness checker for Den specifications"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"

[dependencies]
bboxy450-tlc = { path = "../bboxy450-tlc", version = "0.1.1" }
sha2 = "0.10"

[dev-dependencies]
bboxy450-term-remote = { path = "../bboxy450-term-remote", version = "0.1.1" }
# Enable the existing anchor's model exporter only in tests.
bboxy450-yarn = { path = "../bbt-yarn", version = "=0.1.1", default-features = false, features = ["model"] }
