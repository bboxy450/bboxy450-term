[package]
readme = "README.md"
name = "bboxy450-plugin"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Portable contracts for bboxy450 suite providers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.60.1", default-features = false }
bboxy450-tlc = { version = "0.2.0", path = "../bboxy450-tlc", optional = true }

[features]
# The shipped TLA+ contract models (models/*.tla) as bboxy450-tlc builders.
model = ["dep:bboxy450-tlc"]

[lib]
name = "bbt_plugin"
