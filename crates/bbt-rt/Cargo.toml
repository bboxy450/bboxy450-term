[package]
name = "bbt-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared IO runtime and bounded, non-blocking UI handoff"

[features]
default = ["runtime"]
runtime = ["dep:crossbeam-queue", "dep:libc", "dep:tokio"]

[dependencies]
crossbeam-queue = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
tokio = { version = "1.54.1", optional = true, features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }

[[test]]
name = "runtime"
required-features = ["runtime"]
