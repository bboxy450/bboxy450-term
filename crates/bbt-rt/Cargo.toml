[package]
readme = "README.md"
name = "bboxy450-rt"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared IO runtime and bounded, non-blocking UI handoff"

[features]
default = ["runtime"]
runtime = ["dep:crossbeam-queue", "dep:tokio"]

[dependencies]
crossbeam-queue = { version = "0.3", optional = true }
libc = "0.2"
serde_json = "1"
tokio = { version = "1.54.1", optional = true, features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }

[[test]]
name = "runtime"
required-features = ["runtime"]

[lib]
name = "bbt_rt"
