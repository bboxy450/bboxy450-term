[package]
readme = "README.md"
name = "bboxy450-harness-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local PTY supervisor, fenced clients and capture rings without Tokio"

[dependencies]
bbt-core = { package = "bboxy450-term-core", version = "0.1.0", path = "../bbt-core" }
bbt-rt = { package = "bboxy450-rt", version = "0.1.0", path = "../bbt-rt", default-features = false }
getrandom = "0.3"
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = { version = "1", features = ["serde"] }
zstd = "0.14"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[lib]
name = "bbt_supervisor"
