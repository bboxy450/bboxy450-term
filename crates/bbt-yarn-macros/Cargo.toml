[package]
name = "bboxy450-yarn-macros"
description = "Procedural macros for the yarn async reactor kernel"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"

[package.metadata.upstream]
repository = "https://github.com/Gonzih/kittens-old"
revision = "293e134526bb2deee96f1197d6268aee64495482"

[lib]
name = "bbt_yarn_macros"
proc-macro = true

[dependencies]
proc-macro-crate = "=3.5.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "extra-traits", "parsing"] }
