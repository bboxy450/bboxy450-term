[package]
readme = "README.md"
name = "bboxy450-keychain-file"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Private passphrase-less file custody for caller-owned key material"

[dependencies]
getrandom = "0.3"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
bboxy450-keychain-windows = { package = "bboxy450-keychain-windows", version = "0.1.1", path = "../bboxy450-keychain-windows" }

[dev-dependencies]
tempfile = "3"
