[package]
name = "bboxy450-log-converter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Common IR and cross-harness conversion for Claude Code, Codex and bboxy450-harness logs"
repository.workspace = true
license-file = "LICENSE"

[features]
default = []

[dependencies]
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
