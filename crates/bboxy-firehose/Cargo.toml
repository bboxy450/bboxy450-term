[package]
readme = "README.md"
name = "bboxy450-term-firehose"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Embedded synthetic terminal scenes for PTY throughput and fidelity checks"
# Reference screenshots stay in the repository; crates.io caps uploads at 10 MiB.
exclude = ["reference/"]

[lib]
name = "bboxy_firehose"

[[bin]]
name = "bboxy450-term-firehose"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bbt-core.workspace = true
serde_json = "1"
