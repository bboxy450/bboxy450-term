[package]
name = "bboxy450-svg"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Bounded retained SVG scenes using the bboxy450 drawing and glyph primitives"
readme = "README.md"

[dependencies]
bbt-ui-model.workspace = true
bbt-render.workspace = true
base64 = "0.22"
roxmltree = "=0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
svgtypes = "=0.16.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
png = "0.18"
