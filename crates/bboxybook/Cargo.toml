[package]
readme = "README.md"
name = "bboxy450-book"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native component gallery, document rendering and visual parity tools"

[dependencies]
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "../bbt-ui-model" }
bbt-ui = { package = "bboxy450-ui", version = "0.1.1", path = "../bbt-ui" }
bbt-doc = { package = "bboxy450-doc", version = "0.1.1", path = "../bbt-doc" }
bbt-render = { package = "bboxy450-render", version = "0.1.1", path = "../bbt-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = "=0.30.13"
pollster = "0.4"

[build-dependencies]
regex = "1"
resvg = { version = "=0.48.1", default-features = false }

[lib]
name = "bboxybook"

[[bin]]
name = "bboxybook"
path = "src/main.rs"
