[package]
name = "bboxy450-code"
description = "Bounded, deterministic code reading and search as plain functions and a stdio MCP server"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "LICENSE"
readme = "README.md"
keywords = ["mcp", "code-search", "tree-sitter", "agents"]
categories = ["development-tools"]

[dependencies]
ignore = "0.4.34"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[dev-dependencies]
tempfile = "3"
