[package]
readme = "README.md"
name = "bboxy450-term-proto"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Terminal viewport and GUI wire types shared by app and logic"

[dependencies]
bbt-plugin = { package = "bboxy450-plugin", version = "0.1.1", path = "../bbt-plugin" }
bbt-core = { package = "bboxy450-term-core", version = "0.1.1", path = "../bbt-core" }
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "../bbt-ui-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
jsonschema = { version = "=0.60.1", default-features = false }

[lib]
name = "bbt_proto"
