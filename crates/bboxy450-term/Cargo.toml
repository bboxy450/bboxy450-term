[package]
name = "bboxy450-term"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "bboxy450-term: bboxy450-term"

[features]
notification-probe = ["bboxy450-desktop-notifications/probe"]

[[example]]
name = "notification_probe"
required-features = ["notification-probe"]

[dependencies]
bboxy450-desktop-notifications = { path = "../bboxy450-desktop-notifications" }
bbt-core = { path = "../bbt-core" }
bbt-proto = { path = "../bbt-proto" }
bbt-mux = { path = "../bbt-mux" }
bbt-rt = { path = "../bbt-rt" }
bbt-render = { path = "../bbt-render" }
bbt-ui = { path = "../bbt-ui" }
bbt-ui-model = { path = "../bbt-ui-model" }
png = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "sync", "time", "process", "net", "macros", "signal"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = "=0.30.13"

[dev-dependencies]
ed25519-dalek = "3.0"
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }

[build-dependencies]
regex = "1"
resvg = { version = "=0.48.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSRange", "NSRunLoop", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandEncoder", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLResource", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "CAFrameRateRange", "objc2-metal", "objc2-core-foundation"] }
