[package]
name = "bboxy450-term"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "bboxy450-term: bboxy450-term"

[dependencies]
bbt-mux = { path = "../bbt-mux" }
bbt-rt = { path = "../bbt-rt" }
bbt-render = { path = "../bbt-render" }
bbt-ui = { path = "../bbt-ui" }
bbt-ui-model = { path = "../bbt-ui-model" }
png = "0.18"
serde_json = "1"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "sync", "time"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = "=0.30.13"

[build-dependencies]
regex = "1"
resvg = { version = "=0.48.1", default-features = false }
