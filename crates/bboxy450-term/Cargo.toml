[package]
readme = "README.md"
name = "bboxy450-term"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GPU-rendered terminal and local control surface for agent swarms"

[features]
notification-probe = ["bboxy450-desktop-notifications/probe"]

[[example]]
name = "notification_probe"
required-features = ["notification-probe"]

[dependencies]
bboxy450-term-desktop = { version = "0.1.1", path = "../bboxy450-term-desktop" }
shell-words = "1.1.0"
jiff = "0.2.38"
bboxy450-desktop-notifications = { package = "bboxy450-desktop-notifications", version = "0.1.1", path = "../bboxy450-desktop-notifications" }
bbt-doc = { package = "bboxy450-doc", version = "0.1.1", path = "../bbt-doc" }
bbt-core = { package = "bboxy450-term-core", version = "0.1.1", path = "../bbt-core" }
bbt-proto = { package = "bboxy450-proto", version = "0.1.1", path = "../bbt-proto" }
bbt-mux = { package = "bboxy450-mux", version = "0.1.1", path = "../bbt-mux" }
bbt-rt = { package = "bboxy450-rt", version = "0.1.1", path = "../bbt-rt" }
bbt-render = { package = "bboxy450-render", version = "0.1.1", path = "../bbt-render" }
bbt-ui = { package = "bboxy450-ui", version = "0.1.1", path = "../bbt-ui" }
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.1.1", path = "../bbt-ui-model" }
png = "0.18"
regex = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.17"
libc = "0.2"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "sync", "time", "process", "net", "macros", "signal"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
winit = "=0.30.13"

[dev-dependencies]
bboxy450-tlc = { version = "0.1.1", path = "../bboxy450-tlc" }
ed25519-dalek = "3.0"
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }

[build-dependencies]
regex = "1"
resvg = { version = "=0.48.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSRange", "NSRunLoop", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandEncoder", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLResource", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "CAFrameRateRange", "objc2-metal", "objc2-core-foundation"] }
