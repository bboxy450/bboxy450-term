[package]
autotests = false
readme = "README.md"
name = "bboxy450-term"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GPU-rendered terminal and local control surface for agent swarms"

[features]
default = ["desktop"]
desktop = [
    "dep:bboxy450-harness",
    "dep:bboxy450-term-desktop",
    "dep:bboxy450-desktop-notifications",
    "dep:bbt-render",
    "dep:wgpu",
    "dep:winit",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "bbt-mux/canvas-image",
]
notification-probe = ["desktop", "bboxy450-desktop-notifications/probe"]

[[bin]]
name = "bboxy450-term"
path = "src/entry.rs"

[[example]]
name = "notification_probe"
required-features = ["notification-probe"]

[dependencies]
bboxy450-canvas = { version = "0.2.0", path = "../bboxy450-canvas" }
bboxy450-code = { version = "0.2.0", path = "../bboxy450-code" }
bboxy450-harness = { version = "0.2.0", path = "../bboxy450-harness", default-features = false, features = ["embedded"], optional = true }
bboxy450-usage = { version = "0.2.0", path = "../bboxy450-usage" }
bboxy450-term-desktop = { version = "0.2.0", path = "../bboxy450-term-desktop", optional = true }
shell-words = "1.1.0"
jiff = "0.2.38"
bbt-doc = { package = "bboxy450-doc", version = "0.2.0", path = "../bbt-doc" }
bbt-core = { package = "bboxy450-term-core", version = "0.2.0", path = "../bbt-core" }
bbt-proto = { package = "bboxy450-term-proto", version = "0.2.0", path = "../bbt-proto" }
bbt-mux = { package = "bboxy450-term-mux", version = "0.2.0", path = "../bbt-mux", default-features = false }
bbt-rt = { package = "bboxy450-rt", version = "0.2.0", path = "../bbt-rt" }
bbt-render = { package = "bboxy450-render", version = "0.2.0", path = "../bbt-render", optional = true }
bbt-ui = { package = "bboxy450-ui", version = "0.2.0", path = "../bbt-ui" }
bbt-ui-model = { package = "bboxy450-ui-core", version = "0.2.0", path = "../bbt-ui-model" }
png = "0.18"
sha2 = "0.10"
regex = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.17"
libc = "0.2"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "sync", "time", "process", "net", "macros", "signal"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"], optional = true }
winit = { version = "=0.30.13", features = ["serde"], optional = true }

[dev-dependencies]
bboxy450-tlc = { version = "0.2.0", path = "../bboxy450-tlc" }
# The shipped plugin models, checked by tests/formal_contracts.rs.
bbt-mux = { package = "bboxy450-term-mux", version = "0.2.0", path = "../bbt-mux", features = ["model"], default-features = false }
bbt-plugin = { package = "bboxy450-plugin", version = "0.2.0", path = "../bbt-plugin", features = ["model"] }
bbt-plugin-sdk = { package = "bboxy450-term-plugin-sdk", version = "0.2.0", path = "../bbt-plugin-sdk", features = ["model"] }
bbt-plugin-fixture = { package = "bboxy450-term-plugin-fixture", path = "../bbt-plugin-fixture" }
ed25519-dalek = "3.0"
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }

[build-dependencies]
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bboxy450-desktop-notifications = { package = "bboxy450-desktop-notifications", version = "0.2.0", path = "../bboxy450-desktop-notifications" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
bboxy450-desktop-notifications = { package = "bboxy450-desktop-notifications", version = "0.2.0", path = "../bboxy450-desktop-notifications", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "block2"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSRange", "NSRunLoop", "NSString"], optional = true }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandEncoder", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLResource", "MTLTexture", "MTLTypes"], optional = true }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "CAFrameRateRange", "objc2-metal", "objc2-core-foundation"], optional = true }

[[test]]
name = "it"
path = "tests/it.rs"

# This allocation-budget fixture installs #[global_allocator]. Its allocator
# must not replace the allocator of every other integration test in `it`.
[[test]]
name = "scrollback"
path = "tests/scrollback.rs"
