[package]
name = "bboxy450-term-desktop"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Portable desktop actions and native macOS integration for bboxy450-term"

[dependencies]
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSRunLoop", "NSDate", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSView", "NSWindow", "NSScreen", "objc2-core-foundation"] }
