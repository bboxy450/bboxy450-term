# Project: bboxy450-term — https://github.com/bboxy450/bboxy450-term
# LicenseRef-Respectful-Slop-1.0-Draft; retain accurate source credit.
# Policy: https://github.com/bboxy450/bboxy450-term/blob/main/ATTRIBUTION.md
# Review weakening here in the same commit as the protocol/contract source.
schema = 1

[[contracts]]
name = "ResultContract"
source = "crates/bbt-yarn/tests/protocol.rs"
required_ids = ["RESULT-001"]
require_reachable = ["Submit::fresh", "Submit::reused", "Complete::current", "Complete::stale", "Cancel::clear"]
state_limit = 100000
assumptions = ["atomic pure protocol steps", "effects and environment outside the model"]
fairness_assumed = []
waivers = []

[contracts.domains]
Id = ["A", "B"]

[contracts.bounds]
desired = { min = -1, max = 1 }
visible = { min = -1, max = 1 }
"submitted::A" = { min = 0, max = 1 }
"submitted::B" = { min = 0, max = 1 }
"pending::A" = { min = 0, max = 1 }
"pending::B" = { min = 0, max = 1 }
