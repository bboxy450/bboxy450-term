[[contract]]
name = "JsonlRepair"
title = "Activity JSONL repair yields before continuing its durable cursor"
models = ["JsonlRepair", "BrokenJsonlRepair"]
sources = ["crates/bbt-mux/src/provenance/projection.rs", "crates/bbt-mux/src/provenance/projection/recovery.rs", "crates/bboxy450-term/tests/formal_contracts/provenance_models.rs"]
implementation_tests = ["crates/bbt-mux/src/provenance/projection.rs", "crates/bbt-mux/src/provenance/projection/recovery.rs"]
assumptions = "Three retained pages, one owner and a fixed head. A page, owner turn and publication are atomic; each is weakly fair. The canonical separate rebuild verifies/appends at most 16 rows or 8 ms per turn, with at least one row, and publishes or cleans at most 16 parts. Normal append retains the upstream 128-row/8-ms bound. Batching syncs touched file contents, then directory entries, before SQLite cursor durability. STATE.repair from upstream 2e481e4f is explicitly hidden and conservatively restarted through this one rebuild protocol; unknown legacy temporary trees are retained. Representation-adapted upstream repair_yields_and_resumes_its_durable_cursor_before_publishing and legacy_state_repair_restarts_staging_and_interrupted_publication check restart, retained progress, hidden references and exact signed sequence publication. Staged files are synced once per page before its cursor is persisted and references remain unavailable until all rows are verified and files replaced. The finite model checks turn arbitration and publication, not OS latency, signature algorithms, filesystem crash durability or arbitrary Rust refinement. Native tests reopen the store mid-repair, verify all signatures and sequence order, and retain partial/duplicate/symlink controls."
property = "A repair page yields to the owner before the next page, and publication follows all retained pages. The broken control removes the yield guard and must violate RepairYieldsToOwner; a fair healthy run eventually publishes."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PresentGeneration"
title = "Yarn temporal declarations revalidate generation and assume only named case fairness"
models = ["PresentGeneration", "BrokenPresentGeneration"]
sources = ["crates/bbt-yarn-macros/src/protocol.rs", "crates/bbt-yarn/tests/protocol_temporal.rs", "crates/bbt-yarn/examples/verify.rs"]
implementation_tests = ["crates/bbt-yarn/tests/protocol_temporal.rs", "crates/bbt-yarn/tests/ui.rs"]
assumptions = "One owner; Frame={F}, Generation={First,Second}, each generation selectable once; initially unselected, visible=None and issued/queued/admitted/fetched empty. Atomic Select emits an intent; FetchAdmitted and FetchSucceeded/FailedBeforeEffect/UnknownOutcome/CancelledBeforeStart are later independent inputs. Completion order, delays, duplicates, cancellation and selection changes are arbitrary; outcomes require lifecycle guards. Presentation rechecks generation at commit, not just admission. Each generation's response is ready leads_to visible-or-deselected; therefore a successfully fetched request that remains selected eventually becomes visible. Weak fairness is only on the disjunction of Present::current parameter instances; strong fairness is only on FetchAdmitted::admit instances. Neither assumes fetch success, fair delivery of every event or a fair runtime. Infinite ignore/reject or implicit stuttering cannot satisfy a response. Terminal/quiescent predicate labels do not prune states or discharge unrelated obligations. A-B-A generation reuse is explicitly refused at this finite bound. External execution, real scheduling, retries after restart, unbounded identities and wall-clock progress remain unmodeled."
property = "PRESENT-001 requires visible=None or selected && visible=Some(generation). Correct declaration has exactly 91 states/1365 edges. Removing only the generation comparison (and complementary stale guard) gives 99/1485 and a replayed safety counterexample. Removing only Present::current fairness preserves 91/1365 and produces a replayed closed lasso for both generation response IDs. BrokenProtocolProgress has 1 state/2 ignored-or-rejected edges, explicit WF/SF, a true quiescent predicate and a false terminal target; its response must fail. Every explicit edge in every variant is replayed through the generated step. Java TLC compares full reachable state and labeled transition sets and independent safety/liveness verdicts."
checks = ["make test-formal", "make test"]

[[contract]]
name = "RetryUnknown"
title = "Unknown effect outcome retains admission identity and prevents duplicate commit"
models = ["RetryUnknown", "BrokenRetryUnknown"]
sources = ["crates/bbt-yarn-macros/src/protocol.rs", "crates/bbt-yarn/tests/protocol_temporal.rs", "crates/bbt-yarn/examples/verify.rs"]
