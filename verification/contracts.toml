assumptions = "H=4 history pages (also native boundary checks at H=1..4), FIFO capacity=2, B=2 request ticks, D=3 shutdown ticks; idle/serving/in-step/stopped phases, resumable cursor, remaining step work, two request ages, shutdown flag and saturating deadline all start idle/empty/zero, except history and audit pages. Request arrival, shutdown request, dispatch, yield, stop and each tick are separate atomic actions. One page or one request service costs one occupied worker tick; dispatch/yield consume no page time. Tick runs only during an occupied service or step, so this checks nonpreemptible worker occupancy, not real elapsed scheduling. Only the worker action group (serve, begin step, tick, yield, stop) is weakly fair; arrivals, shutdown requests and background audit completion have no fairness assumption. Shutdown takes priority at yield and can abandon pending requests; requests take priority over the next step. Ages saturate at B+1; the deadline saturates at D, retaining failure even after a late stop. No restart, identity changes, corruption bytes, live log growth, unbounded arrivals/capacities, OS preemption, SQLite/filesystem/crypto costs, page duration or wall-clock deadline proof. The model catches the design, not a call to unbounded recover in arbitrary Rust. Implementation witness: logic::hol_tests::logic_worker_recovery_yields_to_requests_and_shutdown in crates/bbt-mux/src/logic/hol_tests.rs runs an owned headless child with 4096 signed retained events, a missing projection cursor, post-readiness audits, concurrent GUI hello and self_status MCP dispatch, five-second shutdown and durable resume on the next Logic start. The same request/shutdown assertions failed on unfixed b342be1e (49.984 s explicit recover; hello exceeded 30 s, MCP exceeded 10 s, shutdown 12.608 s). Additional real admitted command witness: logic_worker_recovery_yields_during_admitted_knowledge_write submits knowledge_write during the 4096-row rebuild, waits for its signed write_prepared intent in the canonical stream, then checks concurrent GUI hello and self_status, the write reply against the existing 10-second MCP deadline, five-second shutdown and durable restart. Success requires the file plus matching written event; explicit unknown/backlog must retain the exact signed intent across restart without claiming publication; Earlier process evidence exposed an unknown filesystem outcome from concurrent projectors, not a write success. ProjectionWriterExclusion/Lifetime/RootAvailability now map the production per-root descriptor guard and its deterministic removed-guard witness; ordinary ready-fixture ctl reporting still must confirm success. Index::write_locked retains its 64-iteration catch-up cap and knowledge_effects applies provider IO on spawn_blocking rather than the owner. The removed-guard process control removes recovery's 16-row and 8-ms yields and must prevent timely write admission/owner replies; no formal page-cost model proves this elapsed bound. projection/recovery.rs tests separately exercise invalid JSON cursor, append collision, torn page, uncommitted part rename and SQL chain hash refusal, plus distinct state/cursor/head/hash/file length/mtime/missing/AlreadyExists diagnostic triggers. Trigger metadata is retained once per transition through paged cleanup; diagnostic bytes and filesystem costs remain implementation-only coverage. These are actual worker/API/process witnesses, not a proof of arbitrary Rust or wall-clock bounds under stalled filesystem/OS scheduling. Startup audit concurrency is capped at two independent WAL readers; pool mutex leases end before scanning, but I/O, CPU and WAL checkpoint retention remain shared. Correct steps consume one page then return; broken recover consumes H-cursor pages without returning to dispatch. Incident source 1affb986 maps projection.rs recover:205-243 and step:246-266, Engine::step and PROJECTION_BUDGET at engine.rs:37/400 (budget checked between steps), and Logic::shutdown/join at logic.rs:2282. It underestimates recover work by omitting the initial whole-log verify_chain pass, so the negative does not rely on cryptographic cost."
property = "ShutdownEventuallyStopsBeforeDeadline: shutdown requested leads to phase=stopped AND deadline<D. A stop at or after D can never satisfy the response; the broken control must produce a fair liveness counterexample in native and Java TLC, not merely eventually stop. logic_worker_bounds_and_counterexamples asserts named violations, nonempty prefixes, fair cycles for liveness, and replays BeginProvenanceStep, RequestArrives, RequestShutdown, Tick, Tick, Tick through explored labeled edges: phase=in-step, pending=1, age=3, deadline=3; cursor=0 under audit lock or 3 under whole-history recovery. Correct models pass; core boundary checks pass at every H=1..4, with broken safety failing exactly H>B and broken shutdown failing exactly H>=D."
checks = ["make test-formal", "make test"]


