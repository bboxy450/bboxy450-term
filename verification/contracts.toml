property = "The committed layer and the persisted snapshot are each labelled by the generation their export read (CommittedLabelIsItsContent, SnapshotLabelIsItsContent), so a call is served only content of the signal it read (ServedContentIsTheSignalTheCallRead); a store change during an export discards that export. The broken control publishes without the post-export re-check and must fail safety. Witnesses: index.rs snapshots_round_trip_only_for_their_root_signal_and_version, filtered_calls_wait_for_a_build_in_progress and store_signal_follows_manifest_replacement; conformance.rs external edits make old refs and cursors stale. Shipped as plugins/gitkb/models/GitKbIndexFreshness.tla."
