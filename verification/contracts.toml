[[contract]]
name = "ProjectionWriterExclusion"
title = "Per-root JSONL writer exclusivity"
models = ["ProjectionWriterExclusion", "BrokenProjectionWriterExclusion"]
sources = ["crates/bbt-mux/src/provenance/projection.rs", "crates/bbt-mux/src/index.rs", "crates/bbt-mux/src/logic/knowledge_effects.rs", "crates/bbt-mux/src/knowledge/workspaces.rs", "crates/bbt-mux/src/knowledge/routing.rs", "crates/bbt-mux/src/provenance/engine.rs", "crates/bboxy450-term/tests/formal_contracts/projection_writer_model.rs"]
implementation_tests = ["crates/bbt-mux/src/logic/ownership_tests.rs", "crates/bbt-mux/tests/storage_bus_index.rs", "crates/bboxy450-term/tests/ctl.rs", "crates/bboxy450-term/tests/formal_contracts/projection_writer_model.rs"]
assumptions = "Two canonical roots; A admits at most two distinct operation/descriptor tokens, B one. Each root starts with owner/IO/awaiter/issued/callback/background/epoch zero. Binding epochs 0,1,2 mean A-B-A and are captured at admission. Acquire, awaiter cancel, actual IO finish, last-reference drop, late callback, background begin/end, mapping and read request/service are atomic actions. IO finish includes success, prepare/apply refusal/error, panic and pre-start cancellation; a running blocking job remains active when its awaiter disappears. Each completed-reference drop, background return and queued read service is separately weakly fair; admission, dependency IO finish, cancellation, routing and callback arrival are not fair. Background admission stops while a read is queued. Physical advisory locks are assumed to exclude cooperating descriptors on a stable canonical directory/inode; arbitrary Rust/OS refinement, hostile directory replacement, power-loss filesystem semantics, crypto costs and wall-clock fairness are not proved. Scan/reconciliation only updates Markdown mirrors/outboxes, never JSONL, and uses the existing snapshot/revision fences. The real process witness holds admitted A IO, forces an actual same-root provenance turn, verifies B write/read plus GUI/MCP, cancels its awaiter, shuts down/restarts and routes A-B-A while the blocking job still owns its descriptor. Descriptor and stale-Weak tests cover refusal/unwind, last-reference release and old-completion identity. Existing ctl confirmation assertions are retained. Legacy synchronous Index writes wait on the root-number allocator on their IO caller before taking a projection claim; owner-loop entry points lend a preclaimed Index and try that allocator nonblockingly. The unchanged cross-process NUM2 witness checks waiting and fresh unique numbers, and the real-owner witness holds this external number lock while an admitted mutation returns explicit unknown without a file and GUI/MCP progress, then confirms a new write after release. This direct-API compatibility is implementation coverage, not an added fairness assumption for dependency IO."
property = "ExclusiveWriterA/B: a background claim cannot coexist with an effect claim or live effect IO. The broken control removes the actual acquire exclusion. Native replay AcquireA1, BeginProvenanceA reaches owner A=1 and background A=1. A reachable A-held state must retain an enabled root-B admission edge."
checks = ["make test-formal", "make test"]

