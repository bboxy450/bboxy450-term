[[contract]]
name = "StreamToView"
title = "Ordered current-generation view deltas"
models = ["StreamToView", "BrokenStreamToView"]
sources = ["crates/bboxy450-term/tests/formal_contracts/toolkit_models.rs", "crates/bbt-ui/src/modules/transcript.rs"]
implementation_tests = ["crates/bbt-ui/tests/toolkit.rs"]
assumptions = "Three generation incarnations, three deltas, one captured completion. Capture, replace/drop, apply and retire are atomic owner transitions. Sequence gaps are explicit refusals requiring retry or a host snapshot; no network ordering, delivery fairness or unbounded buffer is assumed. Generation exhaustion refuses; byte payloads and transport use implementation tests."
property = "The applied ledger contains each sequence below next exactly once, none at or above next, and every entry belongs to the current generation; dropped views have no entries. Broken bypasses identity/order fences and corrupts that ledger. A separately mutated good model proves that removing its generation guard is detected. Real StreamToView API witnesses include duplicate/gap/drop/A-B-A and coalesced budgeted frames."
checks = ["make test-formal", "make test"]

[[contract]]
name = "IncrementalMarkdown"
title = "Stable-prefix Markdown cache identity"
models = ["IncrementalMarkdown", "BrokenIncrementalMarkdown"]
sources = ["crates/bboxy450-term/tests/formal_contracts/toolkit_models.rs", "crates/bbt-doc/src/markdown/streaming.rs", "crates/bbt-doc/src/markdown/parse.rs"]
implementation_tests = ["crates/bbt-doc/tests/streaming.rs"]
assumptions = "Three semantic prefix identities, three tail states, a definition-presence bit and pending line classification. Append ordinary/inline-bracket lines and append definition lines are distinct actions; classification plus invalidation are internal steps of one atomic parser call, so only the returned state is visible. Definition documents keep full-parse reference context. Container markers, multiline labels, escaped punctuation and temporary ambiguous-label fallback use every-split/full-parse equivalence and candidate-disambiguation tests in bbt-doc/tests/streaming.rs; grammar, UTF-8, YAML and actual work bytes remain implementation coverage. No arbitrary-parser refinement is claimed."
property = "Every returned available cache has the current prefix identity. A definition-line action changes that identity and must invalidate; Broken skips that invalidation. Seven eighths of generated seeds avoid definitions, keeping inline links, task lists and code brackets on the incremental path. The ordinary-bracket witness counts real reparsed bytes across 100 appends."
checks = ["make test-formal", "make test"]

[[contract]]
name = "ScrollStick"
title = "Retained manual offset and explicit tail following"
models = ["ScrollStick", "BrokenScrollStick"]
sources = ["crates/bboxy450-term/tests/formal_contracts/toolkit_models.rs", "crates/bbt-ui/src/modules/transcript.rs"]
implementation_tests = ["crates/bbt-ui/tests/toolkit.rs"]
assumptions = "One view, following bit, manual intent and offsets bounded 0..3. User scroll, jump and layout after content growth/shrink are atomic. The actual projection clamps but the requested intent survives temporary empty/shrunk content. Pixel shaping, wheel burst aggregation and multiple scoped views use the existing app chat_scroll tests."
property = "Following layout shows the tail; manual intent survives layout. User scroll at or beyond the maximum restores following. Jump synchronously restores following and resets requested/manual intent to zero; there is no asynchronous jump liveness claim. Broken overwrites manual intent during layout. A model-edge witness calls real jump_to_latest and compares following and projected offset after each reachable model jump; an implementation unit test checks the private reset state."
checks = ["make test-formal", "make test"]

[[contract]]
name = "DirtyWakeFrame"
title = "Budget-deferred UI queue tail always gets another frame"
models = ["DirtyWakeFrame", "BrokenDirtyWakeFrame"]
sources = ["crates/bboxy450-term/tests/formal_contracts/toolkit_models.rs", "crates/bbt-ui/src/modules/transcript.rs", "crates/bbt-rt/src/wake.rs", "crates/bbt-rt/src/queues.rs"]
implementation_tests = ["crates/bbt-ui/tests/toolkit.rs", "crates/bbt-rt/tests/runtime.rs"]
assumptions = "Upstream DirtyWake bits/pending/producer_pc/drain_pc with three finite admitted deltas and a coalesced frame-ready bit. Marks, posts, bit take, pending clear and recheck can interleave; one owner frame atomically consumes up to two deltas. A nonempty budget remainder separately marks/posts a wake. Weak fairness is required for posted-wake, drain, recheck and frame service; producer arrival is not fair. Sequential consistency only; no OS/frame-time deadline or weak-memory proof."
property = "No immediate dirty bit loses its wake after publication/drain completes; queued plus consumed equals admitted; every admitted delta eventually reaches a frame. Multiple arrivals can share one frame. Broken omits budget-tail rearm and fails liveness. The new coalesced_frames_apply_stream_deltas_and_rearm_a_budgeted_tail witness applies real StreamToView changes through DirtySet/ViewRing; omitting complete_drain is its real-API negative control."
checks = ["make test-formal", "make test"]

