name = "CaptureStoragePressure"
title = "Disk-full capture applies bounded backpressure without terminating backend owners"
models = ["CaptureStoragePressure", "BrokenCaptureStoragePressure"]
sources = ["crates/bbt-supervisor/src/ring/writer.rs", "crates/bbt-supervisor/src/ring/journal.rs", "crates/bboxy450-term/tests/formal_contracts/capture_storage_model.rs"]
