assumptions = "The active logic process owns registry writes; every Registry handle for the canonical account path shares a monotonic in-process epoch. Mutations commit before bumping it and return only after invalidation. Cache load/use and a completed registry write are atomic abstract actions. Epochs 0..2, two routes, two requested generations, one seat, initially empty cache; writes include A to B to A. Provenance binding caches match the requested process generation as well as the registry epoch, validate the current root/watch in memory, and retain only one entry per seat. Failed workspace registration/root persistence is never cached. Delayed loads retain the generation and epoch captured at admission. No fairness is needed for this safety property. Concurrent reads overlapping a write may linearize before it; miss entries retain their starting epoch and cannot survive its invalidation. Direct external SQLite edits/replacement are outside this routing-hint cache contract; fresh authority/grant reads remain uncached. Restart creates a fresh cache. SQLite persistence/failures, path aliasing and thread scheduling use implementation tests, not a refinement proof."
