# Project-owned bounded specifications. Policy: https://github.com/bboxy450/bboxy450-term/blob/main/ATTRIBUTION.md
# Rust witnesses and existing implementation tests supplement these models, not refinement proofs.

[[contract]]
name = "DirtyWake"
title = "Immediate dirty-set admission"
models = ["DirtyWake", "BrokenDirtyWake"]
sources = ["crates/bbt-rt/src/wake.rs"]
implementation_tests = ["crates/bboxy450-term/tests/formal_contracts/witnesses.rs"]
assumptions = "One producer bit and one drain, atomic steps with sequential consistency. The Rust memory model, retained/deferred modes and OS wakers are outside this model."
property = "The recheck after clearing pending must preserve an outstanding wake; omitting it must fail."
checks = ["make test-formal", "make test"]

[[contract]]
name = "RenderLinePlan"
title = "Cached chrome geometry never reuses evicted ink"
models = ["RenderLinePlan", "BrokenRenderLinePlan"]
sources = ["crates/bbt-render/src/chrome/text_cache.rs", "crates/bbt-render/src/chrome/mod.rs"]
implementation_tests = ["crates/bbt-render/src/chrome/text_cache.rs"]
assumptions = "One cached plan, three font and mask incarnations. Build/reuse, eviction, font replacement and plan trimming are atomic renderer-owner calls. Repacking preserves mask IDs; the plan contains no atlas coordinates. No scheduling/liveness or arbitrary Rust refinement claim. Real byte budgets, shape-key inputs, exact pixels, emoji and font/scale A-B-A use cache/image tests."
property = "A reused plan has current font and mask identities. The broken control omits the mask identity guard and consumes an evicted incarnation."
checks = ["make test-formal", "make test-render-input"]

[[contract]]
name = "AsyncRenderPreparation"
title = "Background renderer preparation never mutates a retired owner"
models = ["AsyncRenderPreparation", "BrokenAsyncRenderPreparation"]
sources = ["crates/bboxy450-term/src/gpu.rs"]
implementation_tests = ["crates/bboxy450-term/src/gpu.rs"]
assumptions = "One UI waiter, one pending worker and one completion; cancellation/delivery are atomic owner transitions. A blocking worker may outlive its waiter but owns no mutable UI context. Worker completion/fairness, native driver latency and GPU pixels are not proved. Bounded real-thread tests witness IO responsiveness and late result retirement."
property = "No value installs after its UI waiter is dropped. The broken control installs a late result into the absent owner."
checks = ["make test-formal", "make test-render-input"]

[[contract]]
name = "NotificationReplace"
title = "Bounded notification replacement"
models = ["NotificationReplace", "BrokenNotificationReplace"]
sources = ["crates/bboxy450-term/src/notifications.rs"]
implementation_tests = ["crates/bboxy450-term/tests/formal_contracts/witnesses.rs"]
assumptions = "Two revisions, one queue slot, one authorization barrier; revision 2 replaces revision 1. No OS presentation or permission guarantee."
property = "An admitted newer plan is reconciled before posting an obsolete notice after authorization."
checks = ["make test-formal", "make test"]

[[contract]]
name = "NotificationRecovery"
title = "Initial permission and transient notification IO recovery"
models = ["NotificationRecovery", "BrokenNotificationRecovery"]
sources = ["crates/bboxy450-term/tests/formal_contracts/notification_models.rs", "crates/bboxy450-term/src/notifications.rs", "crates/bboxy450-term/src/cockpit/desktop/attention.rs"]
implementation_tests = ["crates/bboxy450-term/src/notifications.rs", "crates/bboxy450-term/tests/formal_contracts/witnesses.rs", "crates/bboxy450-term/tests/desktop.rs"]
assumptions = "One seat, enabled policy, one question and cancellation, one optional transient failure shared among authorization/post/withdrawal; six variables have at most 192 valuations. Native call start and completion are separate atomic actions. Worker stages, completion groups and the retry timer are weakly fair; calls terminate and permission/backend eventually becomes available. Question/cancel arrival is not fair and can occur before or during the initial permission check. Permanent denial, OS presentation, wall-clock retry duration, queue multiplicity and byte semantics are not proved. Authorization gating is projected to one initial granted check; later rechecks use the actual worker tests."
property = "Enabled policy eventually checks permission even before a question; waiting eventually posts or is cancelled; cancellation eventually withdraws an in-flight completion. Omitting the retry timer leaves a fair stuck execution and must fail liveness. Worker tests enabled_policy_checks_permission_before_a_question_once_until_reenabled, unchanged_waiting_plans_recover_permission_post_and_withdrawal_failures and a_resolution_during_failed_post_cancels_its_retry witness the concrete branches."
checks = ["make test-formal", "make test"]

[[contract]]
name = "AttentionLifecycle"
title = "Retained desktop owner and exact current notification episode"
models = ["AttentionLifecycle", "BrokenAttentionLifecycle"]
sources = ["crates/bboxy450-term/tests/formal_contracts/notification_models.rs", "crates/bbt-mux/src/attention_observer.rs", "crates/bbt-mux/src/logic.rs", "crates/bbt-mux/src/seat_socket.rs", "crates/bboxy450-term/src/cockpit/desktop/attention.rs", "crates/bboxy450-term/src/attention.rs", "crates/bboxy450-term/src/main.rs", "crates/bboxy450-term/src/live.rs", "crates/bboxy450-term/src/headless.rs", "crates/bboxy450-term/src/cockpit.rs", "crates/bboxy450-term/src/cockpit/desktop.rs", "crates/bbt-proto/src/seat_state.rs", "crates/bbt-proto/src/gui/events.rs"]
implementation_tests = ["crates/bbt-mux/src/attention_observer.rs", "crates/bbt-mux/src/seat_socket/attention_tests.rs", "crates/bboxy450-term/src/cockpit/desktop/attention.rs", "crates/bboxy450-term/src/main.rs", "crates/bboxy450-term/tests/formal_contracts/witnesses.rs", "crates/bboxy450-term/tests/desktop.rs"]
assumptions = "One seat, two questions, two UI context streams, three source incarnations (apparent A -> B -> A) and one delayed click. A model incarnation abstracts the exact epoch/generation/ordinal tuple, never a reusable seat ID. Current projection application, context receipt/EOF and click completion are separate atomic actions; duplicates self-loop. UI detach changes only attachment. No fairness is needed for safety; notification progress is checked by NotificationRecovery. FIFO/admitted current-source transport is assumed: lag resnapshot, peer admission, monotonic revisions, bounded receiver storage and authenticated ownership use actual socket/broker/process tests rather than a transport refinement proof."
property = "Detach preserves the desktop owner and current question; replay cannot create a question; an old context/EOF cannot replace a newer stream; only an exact current captured episode can be handled after reconnect, including A -> B -> A. Broken controls remove these guards and must fail safety. Broker live_episode_is_shared_stable_and_replay_cannot_mint and snapshots_cover_lag_without_replaying_stale_deltas, desktop frontend_detach_preserves_policy_and_exact_handled_episode and late_old_context_and_eof_cannot_replace_a_new_frontend, and notification_click_cannot_handle_a_replacement_question_or_process are API witnesses; desktop.rs verifies a detached observer posts and click reopens the same retained process."
checks = ["make test-formal", "make test"]

[[contract]]
name = "WorkspaceFence"
title = "Workspace reads and authority"
models = ["WorkspaceFence", "BrokenWorkspaceFence"]
sources = ["crates/bbt-mux/src/knowledge/workspaces.rs", "crates/bbt-mux/src/logic.rs", "crates/bbt-mux/src/logic/knowledge_effects.rs", "crates/bbt-mux/src/knowledge/seat_reads.rs", "crates/bbt-mux/src/knowledge/roots.rs"]
implementation_tests = ["crates/bbt-mux/tests/workspace_roots.rs", "crates/bbt-mux/tests/harmony_host.rs"]
assumptions = "Two roots, three workspace and provider revisions (including A -> B -> A), one captured job and revocable authority. Atomic selection/capture/publication may interleave; no fairness or eventual provider response is assumed. Read-only provider status uses the same captured root/revision publication fence and stays available without provider IO. Hashes, filesystem safety, native writes, durable commits, MCP text/structured equality, real backend deadlines and unknown mutation outcomes use implementation tests."
property = "Publication requires the captured workspace revision, root and provider revision plus current authority. Removing the provider fence must fail even when the root and workspace revision stay unchanged."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginActivation"
title = "Plugin inspection completion"
models = ["PluginActivation", "BrokenPluginActivation"]
sources = ["crates/bbt-mux/src/plugins/registry.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugins.rs"]
assumptions = "Two source digests and activation generations, one inspection. Digest equality is abstract, not a cryptographic proof."
property = "Disabled, changed-source or changed-generation inspections cannot become active."
checks = ["make test-formal", "make test"]

[[contract]]
name = "HarnessToken"
title = "Guarded single-use readiness"
models = ["HarnessToken", "BrokenHarnessToken"]
sources = ["crates/bboxy450-harness-wake-up/src/guard.rs"]
implementation_tests = ["crates/bboxy450-harness-wake-up/tests/adapters.rs"]
assumptions = "One delivery ID, two ownership epochs, at most two preparations; positive proof and ambiguous native outcomes are Boolean abstractions. Real expiry, foreground PID and terminal modes use guard tests."
property = "A captured token needs current unconsumed proof and input ownership; fresh proof never clears an ambiguous outcome for that ID."
checks = ["make test-formal", "make test"]

[[contract]]
name = "CustodyDelivery"
title = "Local delivery during custody hold"
models = ["CustodyDelivery", "BrokenCustodyDelivery"]
sources = ["crates/bbt-mux/src/messaging/service.rs"]
implementation_tests = ["crates/bbt-mux/tests/messaging.rs"]
assumptions = "One operator-local pending intent, custody initially unavailable. Fair delivery turns are assumed; custody recovery is NOT assumed. This grants no network or signed-envelope bypass."
property = "Local delivery eventually completes without signing custody; signatures require custody and prior admission."
checks = ["make test-formal", "make test"]

[[contract]]
name = "MessageSuppression"
title = "Message wake reconciliation"
models = ["MessageSuppression", "BrokenMessageSuppression"]
sources = ["crates/bbt-mux/src/messaging/ledger/suppression.rs"]
implementation_tests = ["crates/bbt-mux/src/messaging/service/suppression_tests.rs"]
assumptions = "One queued receipt, event/conversation admission, mute and resolution; sender authorization and multi-recipient SQL transactions use implementation tests."
property = "Events, muted recipients and resolved or superseded receipts never cause a later automatic wake."
checks = ["make test-formal", "make test"]

[[contract]]
name = "LifecycleOwnership"
title = "UI detach and exact process ownership"
models = ["LifecycleOwnership", "BrokenLifecycleOwnership"]
sources = ["crates/bboxy450-term/src/cockpit/owners.rs"]
implementation_tests = ["crates/bboxy450-term/tests/lifecycle.rs"]
assumptions = "One UI and retained owner, explicit stop and a PID-birth equality bit. Native process start/exit races and signal delivery require private process tests."
property = "Ordinary detach preserves the owner; explicit stop may signal only the captured process birth."
checks = ["make test-formal", "make test"]

[[contract]]
name = "WindowDurability"
title = "GUI persistence and reply fences"
models = ["WindowDurability", "BrokenWindowDurability"]
sources = ["crates/bboxy450-term/src/window_writes.rs"]
implementation_tests = ["crates/bboxy450-term/tests/formal_contracts/witnesses.rs"]
assumptions = "Two desired versions and GUI epochs, one save job and fenced reply. Save success abstracts the actual durable transaction; refusal/capacity paths use implementation tests."
property = "Old-epoch completions cannot release a reply; each reply waits for its saved version."
checks = ["make test-formal", "make test"]

[[contract]]
name = "FocusFrame"
title = "Produced-frame focus acknowledgement"
models = ["FocusFrame", "BrokenFocusFrame"]
sources = ["crates/bboxy450-term/src/focus_ack.rs"]
implementation_tests = ["crates/bboxy450-term/src/focus_ack.rs"]
assumptions = "One focus operation, prior placement, two process generations, visibility and one completed-frame boundary. GPU presentation and elapsed-time deadlines remain outside the contract."
property = "Success needs a completed frame, settled earlier placements, current generation and a focused visible pane."
checks = ["make test-formal", "make test"]

[[contract]]
name = "CheckpointRestore"
title = "Terminal checkpoint effect isolation"
models = ["CheckpointRestore", "BrokenCheckpointRestore"]
sources = ["crates/bbt-core/src/lib.rs"]
implementation_tests = ["crates/bboxy450-term/tests/formal_contracts/witnesses.rs"]
assumptions = "Two parsed units and queued effects, one snapshot and restore. This models restore only, not byte-parser correctness or all historical replay."
property = "Restore carries parser/grid data and never resurrects queued output effects."
checks = ["make test-formal", "make test"]

[[contract]]
name = "SeatFairness"
title = "Per-seat ingestion progress"
models = ["SeatFairness", "BrokenSeatFairness"]
sources = ["crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bbt-mux/src/logic/ring_batch_tests.rs"]
assumptions = "One continuously ready watched seat, one background seat, watched quota 3 and optional watched checkpoint pause. Scheduler turns are weakly fair; CPU deadlines and larger rings use performance tests."
property = "The background seat progresses even with a hot watched seat; a watched checkpoint pause is local."
checks = ["make test-formal", "make test"]

[[contract]]
name = "RenderSubmission"
title = "GPU arena submission discipline"
models = ["RenderSubmission", "BrokenRenderSubmission"]
sources = ["crates/bbt-render/src/chrome/arena.rs"]
implementation_tests = ["crates/bbt-render/src/chrome/arena.rs"]
assumptions = "Two unit slices in one buffer, staging flush and submission boundary. Alignment, buffer growth/fallback, GPU memory execution and pixels require real GPU tests."
property = "Live slices do not overlap; uploads are flushed before submit and the cursor rewinds at the next submission."
checks = ["make test-formal", "make test"]

[[contract]]
name = "LandingVerification"
title = "Source-bound formal evidence before landing"
models = ["LandingVerification", "BrokenLandingVerification"]
sources = ["scripts/landing.py", "scripts/formal.py", "Makefile"]
implementation_tests = ["scripts/test-landing.py"]
assumptions = "Three candidate identities, two remote bases and one input mutation. Checks abstract successful complete executions; Git atomic fast-forward and cryptographic signatures require real landing fixtures. The model requires fresh Rust checks; the implementation may reuse them only through its existing disjoint-change proof."
property = "Publishing needs clean current-source Rust and formal evidence, matching model inputs and remote base; old or partial evidence cannot authorize a push."
checks = ["make test-formal", "make test"]

[[contract]]
name = "SelectionGesture"
title = "Read-only text gesture source ownership"
models = ["SelectionGesture", "BrokenSelectionGesture"]
sources = ["crates/bbt-ui/src/text_selection.rs", "crates/bboxy450-term/src/terminal_selection.rs", "crates/bboxy450-term/src/navigation.rs"]
implementation_tests = ["crates/bbt-ui/src/text_selection.rs", "crates/bboxy450-term/src/terminal_selection.rs", "crates/bboxy450-term/tests/swarm_workdir.rs"]
assumptions = "One host-owned pointer gesture, one nonempty range, two source replacements A to B to A. Publish/press/drag/copy are atomic UI turns. Pixel hit geometry, Unicode, native mouse delivery and clipboard/browser effects require implementation/process tests; no temporal scheduling claim."
property = "Replacing displayed source retires its captured range; later return to the same text cannot resurrect a stale copy. Broken control retains that range across source changes."
checks = ["make test-formal", "make test"]

[[contract]]
name = "SidebarAccordions"
title = "Independent persistent sidebar accordion choices"
models = ["SidebarAccordions", "BrokenSidebarAccordions"]
sources = ["crates/bbt-ui/src/modules/accordion.rs", "crates/bboxy450-term/src/sidebar.rs", "crates/bboxy450-term/src/scene.rs", "crates/bbt-mux/src/window_journal.rs"]
implementation_tests = ["crates/bbt-ui/tests/sidebar_tasks.rs", "crates/bbt-mux/src/window_journal.rs", "crates/bboxy450-term/tests/chat_sections.rs"]
assumptions = "Four fold bits, two focus identities, one saved mask. Toggle, explicit focus, save and restore are atomic host actions. Save abstracts a completed durable write; WindowDurability separately covers asynchronous persistence. Geometry, resizing, clipping, draft retention and actual process restart use implementation tests. No arbitrary Rust refinement or scheduling/liveness claim."
property = "Toggling one of Hosts/Cloud/Tasks/Chat changes only that fold bit, preserves focus, and save/restore returns the saved choices. The broken control makes Tasks also flip Chat."
checks = ["make test-formal", "make test"]
