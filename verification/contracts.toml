[[contract]]
name = "ImportStaging"
title = "Internal staging cannot spend reserved record numbers"
models = ["ImportStaging", "BrokenImportStaging"]
sources = ["crates/bbt-mux/src/provenance/detector.rs", "crates/bbt-mux/src/index/migration.rs"]
implementation_tests = ["crates/bbt-mux/tests/provenance.rs", "crates/bbt-mux/tests/mcp.rs", "scripts/test-task-migration.py"]
assumptions = "One import, one ordinary writer and one observer; stage, observe, allocate, retry and publish are atomic. At most one legitimate allocation and one broken internal observation. Retry and publication get weakly fair turns; then staged work eventually publishes. Filesystem notification timing, cryptography, crash/fsync and arbitrary ongoing allocation churn use the private native import/replay/concurrent-writer witnesses. No whole-Rust refinement claim."
property = "Private staging never produces an artifact observation or spends a record number; ordinary writes may invalidate a range and require a truthful retry. The broken control observes staging."
checks = ["make test-formal", "make test"]


[[contract]]
name = "HistoricalReconcile"
title = "Historical closure has scoped authority and preserves fresh acceptance"
models = ["HistoricalReconcile", "BrokenHistoricalReconcile"]
sources = ["crates/bbt-mux/src/mcp/work_items.rs", "crates/bbt-mux/src/logic/knowledge_effects.rs"]
implementation_tests = ["crates/bbt-mux/tests/mcp.rs"]
assumptions = "One captured native root, worker/Oracle/operator actors, present/retired ownership and accepted/unaccepted status. Select context and attempt disposition are atomic. A scheduled attempt completes or refuses; no scheduling fairness is required inside the atomic transition. Device custody, root/actor epoch revalidation and byte preservation/signing use the real native writer tests and existing WorkspaceFence/CustodyDelivery contracts."
property = "Only the authenticated operator can reconcile historical records without current ownership references in the selected native root; seat callers retain ownership checks. Accepted verification is never overwritten and historical closure sends no wake. The broken control grants the operator exception to an unowned Oracle seat."
checks = ["make test-formal", "make test"]

[[contract]]
name = "TransportCapture"
title = "Configured remote argv is captured once and remembered only after success"
models = ["TransportCapture", "BrokenTransportCapture"]
sources = ["crates/bbt-ui-model/src/transport.rs", "crates/bbt-ui/src/modules/settings/machines.rs", "crates/bboxy450-term/src/spawn_params.rs", "crates/bboxy450-term/src/settings.rs", "crates/bboxy450-term/src/settings_destinations.rs", "crates/bboxy450-term/src/main.rs", "crates/bbt-proto/src/seat_state.rs", "crates/bbt-mux/src/adapters/launch.rs", "crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bboxy450-term/tests/remote_launch.rs", "crates/bbt-ui-model/src/transport.rs", "crates/bbt-proto/src/seat_state.rs"]
assumptions = "One launcher owner, one machine record present before capture, two configured transport values, one captured launch and one successful/failed completion. Settings edits, capture, launch, remember and a known-exited generation restart are atomic actions. Later Settings changes, including A -> B -> A, may interleave. No fairness or remote availability is assumed: this is safety, not network progress. Existing operation-journal and lifecycle models cover at-most-once admission and process ownership. Shell quoting, exact ssh/mosh/et flags, remote/local cwd separation, Settings TOML replacement, native editor routing, machine catalogue creation/availability and legacy wire defaults use Rust/API/private-process tests. Remote servers, authentication, remote MCP/hooks and transport plugins are outside this cut."
property = "Spawn and known-exited restart use the captured command; only a successful result remembers the captured machine choices. A broken control re-resolves current Settings at launch/restart and allows failed completions to remember; both guards must hold in the good model. compose_machine_fields_equals_spawned_argv_for_every_transport runs fake private executables and compares actual argv against the preview and the exact helper called by logic; machine_choices_persist_without_changing_local_directory_or_role_defaults witnesses durable machine homes and later Settings edits."
checks = ["make test-formal", "make test"]

[[contract]]
name = "TerminalReplyProgress"
title = "Live terminal query reply progress"
models = ["TerminalReplyProgress", "BrokenTerminalReplyProgress"]
sources = ["crates/bbt-supervisor/src/ring.rs", "crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bbt-supervisor/tests/terminal_replies.rs", "scripts/e2e/shared_codex.py", "crates/bboxy450-term/src/gpu/streaming_tests.rs"]
assumptions = "One live query in a stable generation, fewer than 32 pending replies and fair successful host delivery. Existing InputReceipt covers stable-ID retries; identities/capture order, byte-accurate positions, restored-event suppression and real Codex stream/resize use native witnesses. Pending reply survival across owner restart, saturation and physical scanout are not established by this projection."
property = "A live parsed query eventually delivers its reply; dropping the live effect must fail progress."
checks = ["make test-formal", "make test"]

[[contract]]
name = "TerminalReplayQuiet"
title = "Historical terminal queries have no output effects"
models = ["TerminalReplayQuiet", "BrokenTerminalReplayQuiet"]
sources = ["crates/bbt-supervisor/src/ring.rs", "crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bbt-supervisor/tests/terminal_replies.rs", "scripts/e2e/shared_codex.py", "crates/bboxy450-term/src/gpu/streaming_tests.rs"]
assumptions = "One live query in a stable generation, fewer than 32 pending replies and fair successful host delivery. Existing InputReceipt covers stable-ID retries; identities/capture order, byte-accurate positions, restored-event suppression and real Codex stream/resize use native witnesses. Pending reply survival across owner restart, saturation and physical scanout are not established by this projection."
property = "Historical reconstruction emits no terminal writes; forwarding replayed replies must fail safety."
checks = ["make test-formal", "make test"]

[[contract]]
name = "NativeInputOwnership"
title = "Native and ctl key press ownership"
models = ["NativeInputOwnership", "BrokenNativeInputOwnership"]
sources = ["crates/bboxy450-term/src/keyboard.rs", "crates/bboxy450-term/src/main.rs"]
implementation_tests = ["crates/bboxy450-term/src/main.rs", "scripts/e2e/keyboard_checks.py"]
assumptions = "One physical key, local ownership bit and Command bit, initially clear. Press, modifier change, repeat and release are atomic UI-owner turns; all interleavings including returning to the same key are explored. No fairness/liveness claim: the app cannot force a platform release. Character mapping, locks, IME bytes, pointer geometry, transport and PTY scheduling use native/API and raw-process tests."
property = "A locally owned press cannot leak its repeat or release after Command disappears. A new terminal press clears the old local ownership. The broken control drops that ownership guard."
checks = ["make test-formal", "make test"]

[[contract]]
name = "DocumentFeed"
title = "One document feed into the captured live harness"
models = ["DocumentFeed", "BrokenDocumentFeed"]
sources = ["crates/bboxy450-term/src/main.rs", "crates/bboxy450-term/src/navigation.rs", "crates/bboxy450-term/src/terminal_clipboard.rs", "crates/bbt-ui/src/modules/document_modal/controller.rs"]
implementation_tests = ["crates/bboxy450-term/src/main.rs", "scripts/e2e/documents_actions.py"]
assumptions = "One modal, one seat identity with three monotonically increasing process incarnations (apparent A-B-A), one body and a bounded local input queue. Open, copy, body load, restart, capacity change, feed admission and close are atomic UI-owner actions. No fairness or eventual operator feed is assumed. Delivery after local admission uses the existing stable InputReceipt contract; real bracketed-paste UTF-8 plus submit bytes and no duplicate repeat/release use the private PTY stub. The provider exposes exact body bytes and semantic metadata; no original frontmatter serialization is claimed."
property = "Feed needs the captured current generation, a loaded body and local admission; it emits at most once per open and closes after admission. Copy/close do not feed, and a replaced process cannot inherit the action. Broken controls bypass generation and repeat ownership."
checks = ["make test-formal", "make test"]

[[contract]]
name = "GraphQueryCursors"
title = "Query-local Graph pagination ownership"
models = ["GraphQueryCursors", "BrokenGraphQueryCursors"]
sources = ["crates/bboxy450-term/src/knowledge.rs"]
implementation_tests = ["crates/bboxy450-term/tests/knowledge_e2e.rs", "crates/bbt-ui/tests/graphs.rs", "scripts/e2e/decisions.py"]
assumptions = "Two queries and one opaque token, initially unseen in each query. Page admission is atomic in the existing single-outstanding Graph consumer. No scheduling/fairness claim. Existing WorkspaceFence covers provider/root epochs; real query DTOs, repeated-token refusals, decision type filtering, typed edges and produced native paint use API/process tests."
property = "The same opaque token can occur in independent E2E/decision queries without a false duplicate refusal. A repeat inside one query still fails in the real loader. The broken control shares the cursor set across queries."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PaneRasterPublication"
title = "Immutable worker-prepared terminal pixels"
models = ["PaneRasterPublication", "BrokenPaneRasterPublication"]
sources = ["crates/bboxy450-term/src/model.rs", "crates/bboxy450-term/src/gpu.rs"]
implementation_tests = ["crates/bboxy450-term/src/gpu.rs"]
assumptions = "Two source identities, A/B/A replacement, preparation and queue submission interleaved with publication. Published rasters are immutable and one shared GPU queue orders worker submission before UI copies. GPU driver correctness, allocation failure and elapsed frame deadlines use implementation/performance tests. No fairness assumption is needed for the safety check."
property = "Only a submitted current-source raster is published; later preparation never changes pixels retained by an older publication."
checks = ["make test-formal", "make test"]

[[contract]]
name = "VolatileBusSubscription"
title = "Live-only bus subscriptions do not read unrelated seat databases"
models = ["VolatileBusSubscription", "BrokenVolatileBusSubscription"]
sources = ["crates/bbt-mux/src/bus.rs"]
implementation_tests = ["crates/bbt-mux/src/bus.rs"]
assumptions = "One router owner with atomic subscribe/unsubscribe calls; four anonymous/named and new/replay policies. IO means the existing required persistence/replay path, not successful disk completion. Queue overflow, SQL transactions, signatures, transport fairness and wall-clock latency remain implementation-tested."
property = "Only anonymous Start::New Ack::None subscription bypasses retained IO; unsubscribe retires memory and named subscriptions retain their durable cleanup. The broken control also bypasses anonymous replay. The native unavailable-database witness proves the live-only path is independent of retained storage and rejects the replay/durable controls."
checks = ["make test-formal", "make test"]
