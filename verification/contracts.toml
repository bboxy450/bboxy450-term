# Project-owned bounded specifications. Policy: https://github.com/bboxy450/bboxy450-term/blob/main/ATTRIBUTION.md
# Rust witnesses and existing implementation tests supplement these models, not refinement proofs.

# Separate implementation evidence: not a new symbolic model or refinement proof.
[[implementation_evidence]]
name = "YarnRuntimeConcurrency"
check = "make test-yarn-concurrency"
sources = ["crates/bbt-yarn/src/reactor.rs", "crates/bbt-yarn/src/source/mod.rs", "crates/bbt-yarn/src/source/tokio_impl.rs"]
implementation_tests = ["crates/bbt-yarn/src/concurrency.rs", "crates/bbt-yarn/tests/concurrency/run.py", "crates/bbt-yarn/tests/reactor_runtime.rs", "crates/bbt-yarn/tests/tokio_source_coverage.rs"]
state = "One reactor owns adapter slots via exclusive mutable access. Signal starts ready=false, value=0, waker=None; publish writes value then release-publishes readiness and wakes a registered waiter. Poll acquire-checks readiness, registers/replaces the waker, then rechecks. Channel starts empty/open/no waker; a mutex makes send, receive/registration and close atomic at the shim boundary. One producer per channel; no sender cloning; at most three work items per each of two channels. Source completion removes its retained slot before delivery. Replacement cancels the prior future before installing its successor."
properties = "WAKE-001: pending after a completion implies a wake. WAKER-001: the latest pending poll is woken. CLOSE-001: queued item precedes one close event, then permanent dormancy. SERVICE-001: a retained future is delivered once under two serialized consumers. SHUTDOWN-001: a shutdown ready before arbitration wins. DRAIN-001: each actual generated service window handles 1..2 items. GENERATION-001: A -> B -> A replacement returns only the last generation even as old completions race."
bounds = "Loom 0.7.2: preemption_bound=2, max_threads=3, max_branches=1000, no max_permutations/max_duration. Four positive tests, four process-isolated cfg(test)+cfg(loom)+cfg(yarn_broken_controls) negatives; the driver requires nextest exit 100 and each named assertion, refusing build failures or empty selections. Shuttle 0.9.1: seeds 0x5941524e and 0x4c4f4f4d; random and PCT depth=3, 128 executions each per four scenarios (2048 total); max_steps=FailAfter(10000), no time cutoff, at most four concurrent tasks (seven total task identities in replacement) and six work items. Every normal execution is finite; scheduler progress is sampled, not a liveness/fairness proof."
broken_controls = "Remove the Signal fixture's post-registration readiness recheck; keep its stale waker; remove real Mpsc receiver retirement; remove real OneShot future retirement. Each mutation is reachable only in the test-only Loom build and selected in a separate process. The first two validate the admitted-future boundary assumption; the latter two mutate production adapter code under test-only cfg."
limits = "The shim explores the real Yarn adapter/macro code, not Tokio's internal atomics, lock-free queues, cancellation tree, timers, cooperative budget or OS scheduler. Channel synchronization is one mutex transaction and has no capacity/backpressure semantics; the bounded Receiver name only selects the real adapter enum branch. std Arc reference counts for Wake objects are not instrumented. Existing normal Tokio runtime/source tests remain independent API witnesses. No arbitrary Rust correctness, full memory-model, unbounded fairness or formal refinement claim."

[[contract]]
name = "EventLogCheckpoint"
title = "Checkpointed event-log startup and post-readiness historical audit"
models = ["EventLogCheckpoint", "BrokenEventLogCheckpoint"]
sources = ["crates/bbt-mux/src/store/events.rs", "crates/bboxy450-term/src/cockpit.rs", "crates/bboxy450-term/tests/formal_contracts/event_log_model.rs"]
implementation_tests = ["crates/bbt-mux/src/store/events.rs", "crates/bbt-mux/src/store/sqlite.rs", "crates/bbt-mux/tests/storage_bus_index.rs"]
assumptions = "Three retained rows (prefix 1, checkpoint 2, suffix 3), an optional preexisting checkpoint, one corruption present before open and one locally signed append. Open reads/checks/advances in a SQLite snapshot transaction; append and checkpoint advancement share an immediate transaction. The same-database checkpoint is trusted metadata, not protection against an adversary rewriting both checkpoint and history. Hash/signature rejection is abstracted, with actual Ed25519, JSON, sequence/prev/hash, schema and SQL trigger witnesses in Rust. Startup schedules at most two blocking historical audits concurrently, on separate WAL reader leases; the SQLite pool mutex is released before each scan, and the audit opens no writer transaction. Read snapshots may delay WAL checkpoint reclamation and share disk/CPU; queue admission and audit/report actions are weakly fair while the process remains alive; process termination can interrupt an audit and the next start audits again. Diagnostic delivery is best effort; stderr also reports failures. Concurrent malicious mutation after the opening snapshot, hash collisions, disk failure, OS scheduling and arbitrary Rust refinement are unmodeled."
property = "A tampered checkpoint or suffix prevents readiness. First upgrade verifies at most 128 suffix rows synchronously, using an explicitly unaudited prefix anchor; historical tampering is eventually reported by the detached genesis pass after readiness. The checkpoint payload is rehashed as well as comparing the stored SQL hash. A locally signed append advances only a matching checkpoint atomically, keeping ordinary reopen work independent of retained history. BrokenEventLogCheckpoint skips only the existing checkpoint hash check and must fail safety. opening_n_rows_with_checkpoint_n_minus_one_verifies_exactly_one counts the actual successful signature verifications; historical_tampering_is_reported_after_ready_with_and_without_a_checkpoint observes the real private diagnostic socket."
checks = ["make test-formal", "make test"]

[[contract]]
name = "UsagePoller"
title = "Read-only account usage, current attempt publication and visible deadlines"
models = ["UsagePoller", "BrokenUsagePoller"]
sources = ["crates/bboxy450-usage/src/poller.rs", "crates/bboxy450-term/tests/formal_contracts/usage_models.rs"]
implementation_tests = ["crates/bboxy450-usage/tests/providers.rs", "crates/bboxy450-usage/src/poller.rs", "crates/bboxy450-term/src/usage_strip.rs", "crates/bbt-ui/tests/title_bars.rs"]
assumptions = "Three attempts; account names A/B/A; one captured reply delivered twice; owner transitions atomic; deadlines weakly fair, network replies and user refreshes need not be fair. The model allows late completions beyond the implementation's serial worker, to check the public generation fence. Refresh clears visible values before identity re-observation. Credentials are revalidated before publishing an HTTP response. Account changes between unobserved polls are not detected immediately. Actual wall clocks, thread scheduling, OS counters/Keychain, filesystem and HTTP parsing/limits remain implementation-only; no arbitrary Rust refinement claim."
property = "Any visible number belongs to the current account and attempt, even after A/B/A, expiry and duplicate/late replies; each pending attempt eventually retires under fair deadline service. Age clears the current flag. Broken removes the epoch/pending/identity guard and publishes a delayed reply; the API witness rejects it. Blocking calls have a visible timeout and one retained outstanding call per independent worker; tests check that a timed-out call cannot create an unbounded replacement queue."
checks = ["make test-formal", "make test"]

