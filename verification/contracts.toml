pared intent in the canonical stream, then checks concurrent GUI hello and self_status, the write reply against the existing 10-second MCP deadline, five-second shutdown and durable restart. Success requires the file plus matching written event; explicit unknown/backlog must retain the exact signed intent across restart without claiming publication; Earlier process evidence exposed an unknown filesystem outcome from concurrent projectors, not a write success. ProjectionWriterExclusion/Lifetime/RootAvailability now map the production per-root descriptor guard and its deterministic removed-guard witness; ordinary ready-fixture ctl reporting still must confirm success. Index::write_locked retains its 64-iteration catch-up cap and knowledge_effects applies provider IO on spawn_blocking rather than the owner. The removed-guard process control removes recovery's 16-row and 8-ms yields and must prevent timely write admission/owner replies; no formal page-cost model proves this elapsed bound. projection/recovery.rs tests separately exercise invalid JSON cursor, append collision, torn page, uncommitted part rename and SQL chain hash refusal, plus distinct state/cursor/head/hash/file length/mtime/missing/AlreadyExists diagnostic triggers. Trigger metadata is retained once per transition through paged cleanup; diagnostic bytes and filesystem costs remain implementation-only coverage. These are actual worker/API/process witnesses, not a proof of arbitrary Rust or wall-clock bounds under stalled filesystem/OS scheduling. Startup audit concurrency is capped at two independent WAL readers; pool mutex leases end before scanning, but I/O, CPU and WAL checkpoint retention remain shared. Correct steps consume one page then return; broken recover consumes H-cursor pages without returning to dispatch. Incident source 1affb986 maps projection.rs recover:205-243 and step:246-266, Engine::step and PROJECTION_BUDGET at engine.rs:37/400 (budget checked between steps), and Logic::shutdown/join at logic.rs:2282. It underestimates recover work by omitting the initial whole-log verify_chain pass, so the negative does not rely on cryptographic cost."
