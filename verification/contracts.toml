assumptions = "One atomic protocol owner, Id={Only}, all seven Boolean fields initially false. Begin/Retry emits a Write intent; separate WriteAdmitted claims the identity; later completion is Succeeded, FailedBeforeEffect, UnknownOutcome or CancelledBeforeStart. UnknownOutcome conservatively includes a possible external commit and retains the claim without exposing a certain success. Known failure before the effect releases the claim. Retry requires no intent/admission and an unclaimed identity; successful/uncertain claims are retained. No fairness is required for this safety property. Protocol guards and pure generated API witnesses check the finite claim contract; no actual remote I/O, persistent dedup service, restart recovery or arbitrary Rust refinement is proved."
