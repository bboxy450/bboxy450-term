checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginConnection"
title = "Live plugin connections and activation generation"
models = ["PluginConnection", "BrokenPluginConnection"]
sources = ["crates/bbt-mux/src/plugins/host.rs", "crates/bbt-mux/src/plugins/client.rs", "crates/bbt-mux/src/knowledge/roots.rs", "crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugin_host.rs", "crates/bbt-mux/src/plugins/client.rs"]
assumptions = "One plugin, one connection and one in-flight call per connection projection; activation generations 1..4 with disable and enable each advancing the generation (A -> B -> A). Authority reads, the post-mutation reconcile and connection replacement are atomic actions that may interleave with a call. Parallel calls on a concurrent descriptor each capture the same connection generation, so one call is representative. Process spawn, JSON-RPC demultiplexing, schema validation, deadlines and OS reaping use implementation tests."
property = "A result is delivered only when the connection's generation equals the current enabled activation generation; a superseded result is refused and closes its connection. After a disable has been reconciled, before its control reply, no connection remains. The broken control delivers without the completion generation check and must fail safety. tests/plugin_host.rs a_result_from_a_superseded_generation_is_refused and enabled_plugins_serve_calls_and_disable_closes_their_connection are API witnesses."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginHook"
title = "Hook delivery: bounded queue, activation generation and blocking decisions"
models = ["PluginHook", "BrokenPluginHook"]
sources = ["crates/bbt-mux/src/plugins/hooks.rs", "crates/bbt-mux/src/plugins/host.rs", "crates/bbt-mux/src/logic.rs", "crates/bbt-plugin/src/policy.rs", "crates/bbt-plugin/src/trust.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugin_host.rs", "crates/bbt-plugin/tests/policy.rs", "crates/bbt-plugin-sdk/src/runtime.rs"]
assumptions = "One plugin, activation generations 1..3 (disable, enable and re-trust without the block grant each advance it), a host subscription snapshot that lags until a reconcile, a two-slot queue standing for HOOK_QUEUE, and one blocking decision with a two-tick ceiling. notify, reconcile, queue offers and dequeues are atomic and interleave freely; no fairness is assumed. Several subscribers, payload grants, bus subject matching, JSON-RPC transport and real deadlines use implementation tests."
property = "A queued hook is delivered only to the enabled activation whose generation it was offered under, otherwise it is refused as stale; an offer beyond the queue is dropped and counted, never waited for. A blocking decision is made only for a subscriber holding the block grant, waits at most the ceiling, and a timeout or a reply from a superseded activation follows the grant's failure policy. The broken control delivers queued items without the generation check and must fail safety. tests/plugin_host.rs hooks_receive_harness_and_bus_events_with_payload_only_when_granted and blocking_hooks_veto_only_with_a_grant_and_time_out_by_policy are API witnesses."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginHookQueue"
title = "Plugin hook queue: many plugins share one bounded FIFO; superseded deliveries are never delivered"
models = ["PluginHookQueue", "BrokenPluginHookQueue"]
sources = ["crates/bbt-mux/src/plugins/hooks.rs", "crates/bbt-mux/src/models.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugin_host.rs"]
assumptions = "Two plugins of one root, a FIFO of two slots (HOOK_QUEUE abstracted) and three offers; each queued delivery records its plugin and that plugin's activation generation; any plugin may be disabled or re-enabled (its generation superseded) at any time; a full queue drops and counts. Delivery timing, budgets, grants and payloads are covered by PluginHook and implementation tests."
property = "The head is delivered only while its plugin's generation is current, otherwise it is skipped as stale (NoInvalidEffect), and every queued delivery's generation is at most its plugin's current one (QueuedGenerationsNeverAhead, a bounded \\A over the slots with dynamic-index reads). The broken control delivers a stale head and must fail safety. Witness: tests/plugin_host.rs hook_deliveries_are_measured_and_superseded_ones_are_named_skips. Shipped as crates/bbt-mux/models/PluginHookQueue.tla."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginRuntime"
title = "Plugin SDK runtime: bounded admission, cancellation and host callbacks during a call"
models = ["PluginRuntime", "BrokenPluginRuntime"]
sources = ["crates/bbt-plugin-sdk/src/runtime.rs", "crates/bbt-plugin-sdk/src/lib.rs", "crates/bbt-plugin-sdk/src/models.rs"]
implementation_tests = ["crates/bbt-plugin-sdk/src/runtime.rs", "crates/bbt-mux/tests/plugin_sdk_examples.rs"]
assumptions = "One plugin process, one worker and its reader thread; at most two admitted requests in this instance (MAX_PENDING abstracted; others are refused busy). A served call may ask the host once; the host answers or the call is cancelled. Fair reader, worker and host steps. Deadlines, frame and result limits, panics and the JSON-RPC wire are unit-tested."
property = "Every admitted request is answered exactly once (EveryAdmittedRequestIsAnswered; AnsweredAtMostAdmitted) even while its call waits for a host answer that only the reader routes, and a cancelled call answers cancelled and drops a late host answer. The broken control lets the reader wait for the worker while the worker waits for the host and must fail liveness. Witnesses: runtime.rs host_requests_made_while_serving_a_call_are_answered_through_the_reader and rejects_parse_errors_and_requests_beyond_the_pending_bound. Shipped as crates/bbt-plugin-sdk/models/PluginRuntime.tla for plugin authors."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginSetup"
title = "Plugin setup: status, a bounded login in a visible bare login row, no surviving process"
models = ["PluginSetup", "BrokenPluginSetup"]
sources = ["crates/bbt-mux/src/plugins/setup.rs", "crates/bbt-mux/src/plugins/control.rs", "crates/bbt-mux/src/logic.rs", "crates/bbt-supervisor/src/supervisor.rs", "crates/bbt-plugin/src/shape.rs", "crates/bbt-plugin-sdk/src/runtime.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugin_setup.rs", "crates/bbt-mux/src/plugins/setup.rs", "crates/bboxy450-term/tests/plugin_login.rs", "crates/bbt-supervisor/tests/supervisor.rs"]
assumptions = "One setup run of one pin. The login may start one child and may never exit; its budget is three ticks. Re-trust may happen at any point. The login runs in a visible plugin login row; the setup job that owns it can be lost with its logic owner at any time while it runs. The PTY, signal delivery, reaping, the supervisor's bare-terminal group cleanup and the status command's own exit codes use real process tests."
property = "Once the login phase ends (exit, budget, or the next logic owner's cleanup of an orphaned login), neither the login nor any process it started is alive (NoProcessOutlivesTheLogin), and the login never runs past its budget. The login row is open only while the login runs (RowOpenOnlyWhileLoginRuns). A result is recorded only by its owning setup job while the pin is unchanged (NothingRecordedWithoutOwner). The broken control ends only the login, not its process group, and must fail safety. Witnesses: tests/plugin_setup.rs a_hanging_login_and_its_children_are_ended_at_the_budget, a_login_seat_past_its_budget_ends_its_process_group_and_closes, a_login_seat_left_by_a_stopped_logic_owner_is_ended_on_reattach; bboxy450-term tests/plugin_login.rs a_typed_login_in_the_plugin_login_row_logs_in_or_is_refused; supervisor a_bare_terminal_gets_only_its_environment_and_ends_its_process_group."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginHookGate"
title = "Hook shim waits for a blocking plugin's decision, boundedly"
models = ["PluginHookGate", "BrokenPluginHookGate"]
sources = ["crates/bboxy450-harness-wake-up/src/hook.rs", "crates/bbt-mux/src/adapters/hook.rs", "crates/bbt-mux/src/seat_socket.rs", "crates/bbt-mux/src/plugins/hooks.rs", "crates/bbt-mux/src/logic.rs"]
implementation_tests = ["crates/bbt-mux/tests/hook_gate.rs", "crates/bboxy450-harness-wake-up/tests/hook_sink.rs"]
assumptions = "One gated event and one blocking subscriber. The gate file lags the host's blocking subscriptions (GrantBlock/RevokeBlock are unfair, WriteGate is fair). One tick advances both clocks: the host decides by tick 2 (REPLY_MARGIN before the shim) and the shim stops waiting at tick 3 (ceiling minus GATE_MARGIN). The host may be lost at any point (crash, socket failure, refusal); plugin replies are unfair. Several blocking subscribers, the per-harness exit-code encoding, process spawn and real deadlines use implementation tests."
property = "A shim whose gate does not list the event never waits and never vetoes. A veto comes only from a plugin deny or a fail-closed policy. A waiting shim always answers (ShimAlwaysAnswers) under weak fairness of time, the host and the shim. The broken control waits for the host without a bound and must fail liveness. tests/hook_gate.rs gated_hooks_veto_allow_time_out_by_policy_and_keep_the_fast_path and tests/hook_sink.rs gated_events_wait_only_when_listed_and_fail_by_policy are API witnesses."
checks = ["make test-formal", "make test"]

[[contract]]
name = "PluginHostApi"
title = "Plugin-originated host requests during a host call"
models = ["PluginHostApi", "BrokenPluginHostApi"]
sources = ["crates/bbt-mux/src/plugins/client.rs", "crates/bbt-mux/src/plugins/host_api.rs", "crates/bbt-mux/src/plugins/host.rs", "crates/bbt-plugin/src/trust.rs", "crates/bbt-plugin-sdk/src/runtime.rs"]
implementation_tests = ["crates/bbt-mux/tests/plugin_host.rs", "crates/bbt-mux/tests/plugin_messages.rs", "crates/bbt-mux/src/messaging/plugin_sender_tests.rs", "crates/bbt-mux/src/plugins/client.rs", "crates/bbt-plugin-sdk/src/runtime.rs", "crates/bbt-plugin/tests/shape.rs"]
assumptions = "One connection, one host call in flight and one plugin-originated request issued while the plugin serves it; the plugin answers its call only after the host answered its request. Activation generations 1..2; supersession and re-trust without the grant are unfair and may happen at any point; the reader, the handler task and the plugin are weakly fair. The JSON-RPC framing, concurrency bound (MAX_HOST_CALLS), per-request budget, size caps, the records reader and bus publication use implementation tests."
property = "Every host call in flight is eventually answered although the plugin asks the host in the middle of it: the reader admits the request to a handler and keeps reading. Each admitted request ends in exactly one outcome, an effect only with the grant under the connection's current generation, otherwise a refusal (host_api_not_granted or provider_changed). The broken control's reader serves plugin requests only between calls, so the call never completes, and it must fail liveness. tests/plugin_host.rs host_api_requests_are_granted_confined_and_served_during_a_call and client.rs a_host_request_during_a_call_is_answered_and_the_call_completes are API witnesses."
checks = ["make test-formal", "make test"]

