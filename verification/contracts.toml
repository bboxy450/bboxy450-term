assumptions = "Two inode identities, one cached connection, initially matching path/inode and an armed unchanged watch. Path replacement and its synchronous kernel vnode notification are one abstract action; replacement can occur repeatedly including A to B to A. A zero-time kevent poll is the reuse observation, with the same subsequent check-to-use race as the old path stat. Only canonical absolute paths with all lexical ancestors watched qualify; symlink aliases, registration/poll errors and resource exhaustion fall back to path stat. Ancestor directory entry writes/rename/delete/revoke conservatively invalidate. Registration precedes a final path identity check. Non-macOS always uses the original stat. No fairness is needed for safety. Native tests cover leaf replacement while the old inode remains linked, parent/ancestor replacement, alias refusal, new SQLite values and ordinary WAL writes. Kernel kqueue correctness and arbitrary filesystem behavior are assumptions, not Rust/TLC refinement."
property = "Reuse requires the cached inode to match the current path inode; uncertainty requires rechecking. BrokenInodeFence ignores invalidation and must fail safety. Extra directory/queue descriptors live only with leased/pooled connections; idle connections retain the existing 64-entry cap, and monitor allocation failure safely restores per-read stat."
