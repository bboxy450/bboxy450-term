[[contract]]
name = "InputDedupEviction"
title = "Bounded terminal receipts preserve fresh input progress"
models = ["InputDedupEviction", "BrokenInputDedupEviction"]
sources = ["crates/bbt-supervisor/src/supervisor.rs", "crates/bbt-supervisor/src/protocol.rs", "crates/bbt-mux/src/provider/mod.rs", "crates/bboxy450-term/tests/formal_contracts/input_dedup_model.rs"]
implementation_tests = ["crates/bbt-supervisor/tests/supervisor.rs", "crates/bbt-supervisor/src/supervisor.rs", "crates/bbt-mux/tests/input_diagnostics.rs"]
assumptions = "One supervisor actor, two receipt slots, four distinct fresh admissions and at most one pending write. Initially no receipts/admissions; states are vacant, pending, PTY-written and partial-unknown. Admission with oldest-terminal eviction is atomic; completion or timeout is a separate atomic action and can be delayed. Retained replay, conflicting bytes and Busy refusal do not mutate receipts. Admission and the completion/timeout group are weakly fair; success of a PTY write is not assumed. The finite prefix checks progress past capacity, not unbounded Rust refinement. Existing InputReceipt covers lease fencing and at-most-once effects while retained; byte digests, guard changes, process restart, transport loss and real timer/OS behavior use native witnesses. Pending exclusion, PartialUnknown eviction, exact map/deque bounds and the 4097th real PTY input are implementation-tested. Evicted-ID reuse is deliberately a new operation, witnessed by the real PTY test, not a lifetime at-most-once guarantee. Diagnostic seat identity uses a private provider/journal witness, not this state projection."
property = "The bounded FIFO keeps the newest two admitted receipts, never evicts pending input, and admits beyond capacity once writes finish or time out. Removing only eviction leaves a full terminal map that refuses fresh input forever and must fail liveness in native and TLC."
checks = ["make test-formal", "make test"]

