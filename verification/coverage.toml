[[crate]]
name = "bboxy450-term-remote"
status = "contract-model"
models = ["RemoteDelivery", "BrokenRemoteDelivery", "RemoteResume", "BrokenRemoteResume"]
scope = "Two messages A/B through submit, send, duplicate arrival, ack, link drop, reconnect and remote crash with replay; the remote applied set is durable (BrokenRemoteDelivery makes it volatile and double-applies). tests/delivery_witness.rs exhaustively walks every enabled runtime operation from every reachable harness observation using fresh Outbox/Inbox/FileJournal instances and shortest-path replay against the Yarn model; decisions, Fresh/Apply, state projections and all three invariants agree, with fixed runtime/model coverage counts and a volatile-journal runtime control. Batch flush maps to a sequence of Send events. The link does not forge Applied frames; receipts come from real Inbox arrivals on the current connection. Ack retirement removes the message frame from the link projection; late frames after retirement and unused model edges remain outside this witness. tests/delivery_card.rs checks the generated bounded card and its Mermaid fixture against the spec source hash and recorded assumptions. Abstraction: journal-then-apply is one atomic model step; the runtime fsyncs the id first, so a crash between journal and apply loses that turn (reported unknown), never doubles it. Frame codec bounds, unknown-frame skipping and exact IR bytes are unit-tested only. RemoteResume covers event resume: drop/reconnect keeps the log, a remote restart is a new epoch that loses the tail and must reset the view first (BrokenRemoteResume resumes without reset). tests/serve.rs runs the relay over a real Unix socket with a scripted fake ACP agent process: exactly-once ops, replay after the cursor, reset on unknown epoch, durable dedup across server restart; the serve binary is driven over stdio. Sequence numbers are abstracted to the first two events of an epoch; the bounded 4096-event tail and gap/duplicate cursor arithmetic are implementation-tested. The attach bridge (ACP stdio of a local harness acp-agent profile), install (uname-matched copy into ~/.local/bin), pings with a no-bytes dead line, agent stderr logs and refusal of exited agents are implementation-tested: tests/attach.rs, and make test-remote-live runs a real bboxy450-harness ACP turn (scripted provider) across the link. The MCP relay (local-socket MCP servers rewritten to remote `mcp` processes, relayed per channel over the link to the original local command; channels end with the link) is tested end to end in tests/attach.rs. Cross-host routing is not built yet."
sources = ["crates/bboxy450-term-remote/src/delivery.rs", "crates/bboxy450-term-remote/src/link.rs", "crates/bboxy450-term-remote/src/frame.rs", "crates/bboxy450-term-remote/src/lib.rs", "crates/bboxy450-term-remote/src/resume.rs", "crates/bboxy450-term-remote/src/resume_model.rs", "crates/bboxy450-term-remote/src/serve.rs", "crates/bboxy450-term-remote/src/main.rs", "crates/bboxy450-term-remote/src/client.rs", "crates/bboxy450-term-remote/src/attach.rs", "crates/bboxy450-term-remote/src/install.rs"]

[[crate]]
name = "bboxy450-usage"
status = "contract-model"
models = ["UsagePoller"]
scope = "Three refresh attempts and account incarnations A/B/A, delayed/duplicate completion, deadline, and age-to-stale. Weak fairness of deadline service ensures pending polls retire, without fairness of network replies. Source API witnesses exercise the real generation fence, injected fetcher/reader and timeout. HTTP schemas, credential-source priority, bounded OS IO, machine counters and measured CPU cost remain implementation-only coverage. Account identity is observed at poll boundaries, not continuously; no OS cancellation or arbitrary Rust refinement claim."
sources = ["crates/bboxy450-usage/src/poller.rs", "crates/bboxy450-usage/src/lib.rs", "crates/bboxy450-usage/src/machine.rs", "crates/bboxy450-usage/src/io.rs"]
