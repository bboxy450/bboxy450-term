sources = ["plugins/gitkb/src/main.rs", "plugins/gitkb/src/backend.rs", "plugins/gitkb/src/store.rs", "plugins/gitkb/src/methods.rs", "plugins/gitkb/src/native.rs", "plugins/gitkb/examples/install-gitkb-plugin.rs", "plugins/gitkb/build.rs"]

