scope = "Plugin-side stdio MCP runtime: request admission, cancellation, deadlines, limits, refusal encoding, hook routing (on_hook) and host requests made while serving a call (Ctx::host) are unit-tested in-process; descriptor validity reuses the host's bboxy450-plugin validator. Host activation stays modelled by PluginActivation host hook delivery by PluginHook and the plugin-to-host request interleaving by PluginHostApi."
sources = ["crates/bbt-plugin-sdk/src/lib.rs", "crates/bbt-plugin-sdk/src/runtime.rs"]

[[crate]]
