[[crate]]
name = "bboxy450-plugin"
status = "contract-model"
models = ["PluginActivation", "PluginHook", "PluginConnection", "PluginHostApi"]
scope = "Host activation generation/source-digest contract and hook policy (subjects, ceilings, payload and block grants, delivered per PluginHook); guest execution, ABI and cryptographic implementation use fixtures. Live plugin connections are fenced by activation generation (PluginConnection); plugin-originated host requests made during a host call are admitted and answered per PluginHostApi; JSON-RPC demultiplexing uses private host fixtures."
