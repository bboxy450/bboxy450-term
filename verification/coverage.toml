[[crate]]
name = "bboxy450-harness-host"
status = "contract-model"
models = ["InputReceipt", "TerminalReplyProgress", "TerminalReplayQuiet"]
scope = "Live terminal query replies versus effect-free replay use bounded progress/safety projections and native position/duplicate/generation/restart fixtures; saturation and pending-reply survival across owner restart remain implementation gaps. One stable input operation across two logic leases; models at-most-once effects, not PTY syscall or OS durability behavior."
sources = ["crates/bbt-supervisor/src/supervisor.rs", "crates/bbt-supervisor/src/ring.rs"]

[[crate]]
name = "bboxy450-term-mux"
status = "contract-model"
models = ["VolatileBusSubscription", "TransportCapture", "CheckpointFence", "InputReceipt", "WorkspaceFence", "PluginActivation", "CustodyDelivery", "MessageSuppression", "SeatFairness", "AttentionLifecycle", "SidebarAccordions", "OperationRecovery", "DiagnosticRead", "ImportStaging", "HistoricalReconcile", "TerminalReplyProgress", "TerminalReplayQuiet"]
scope = "Live-only anonymous bus subscription/unsubscription avoids retained storage; replay and durable policies remain on their original path. Four finite policy choices are modeled; unavailable-database and actual delivery controls witness the Rust branch. Live terminal query replies versus effect-free replay use bounded progress/safety projections and native position/duplicate/generation/restart fixtures; saturation and pending-reply survival across owner restart remain implementation gaps. Diagnostic pages are own-seat only with current completion authority and no operator acknowledgement; redaction, file and cursor bounds use fixtures. Original document-operation recovery is read-only and actor/root scoped. Number collision classification/allocation uses knowledge API fixtures. Checkpoint/input fences, captured workspace/provider revisions and plugin stale-completion guards, local delivery/suppression, fair seat ingestion and current live notification episodes without replay-created keys. Native GitKB effects, signing, commit atomicity and unknown outcomes use real private host fixtures. Literal Unicode/BINARY namespace ranges use store/sqlite/power_tests.rs for Rust starts_with equivalence and history-independent SQL work. The pending-only publication index preserves the existing delivery state machine; SQL migration, FIFO/recovery and history-independent idle query work use messaging/ledger/power_tests.rs, including an unindexed broken performance control. Reserved import staging and historical operator reconciliation have bounded safety/progress models plus actual observer/import and signed-writer controls. Finite contract projections; no SQL planner, whole-mux or observer transport refinement proof."
sources = ["crates/bbt-mux/src/bus.rs", "crates/bbt-mux/src/mcp/diagnostics.rs", "crates/bbt-mux/src/mcp/bridge.rs", "crates/bbt-mux/src/mcp/journal.rs", "crates/bbt-mux/src/mcp/recovery.rs", "crates/bbt-mux/src/index.rs", "crates/bbt-mux/src/checkpoint.rs", "crates/bbt-mux/src/knowledge/workspaces.rs", "crates/bbt-mux/src/logic/knowledge_effects.rs", "crates/bbt-mux/src/plugins/registry.rs", "crates/bbt-mux/src/messaging/service.rs", "crates/bbt-mux/src/messaging/ledger/suppression.rs", "crates/bbt-mux/src/messaging/tree.rs", "crates/bbt-mux/src/messaging/ledger.rs", "crates/bbt-mux/src/messaging/ledger/power_tests.rs", "crates/bbt-mux/src/store/sqlite.rs", "crates/bbt-mux/src/store/sqlite/power_tests.rs", "crates/bbt-mux/src/logic.rs", "crates/bbt-mux/src/attention_observer.rs", "crates/bbt-mux/src/seat_socket.rs", "crates/bbt-mux/src/provenance/detector.rs", "crates/bbt-mux/src/index/migration.rs", "crates/bbt-mux/src/mcp/work_items.rs"]

