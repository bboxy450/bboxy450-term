name = "bboxy450-term-desktop-core"
status = "contract-model"
models = ["LifecycleOwnership"]
scope = "UI detach versus explicit stop at the host boundary. Native event delivery and platform lifecycle still require private app tests."
sources = ["crates/bboxy450-term-desktop-core/src/lib.rs", "crates/bboxy450-term/src/cockpit/owners.rs"]

