# Every workspace crate participates in the mandatory formal gate.
# contract-model means a bounded design contract, never a proof of arbitrary Rust.
# implementation-tests entries make remaining formal coverage explicit.

[[implementation_only]]
name = "DeterministicHookAndWriterFixtures"
sources = ["crates/bbt-mux/tests/plugin_host.rs", "crates/bbt-supervisor/src/ring/writer.rs", "crates/bbt-plugin-fixture/src/reference.rs"]
tests = ["scripts/test-ledger-fixture-controls.py"]
models = []
scope = "Newline framing and buffering a fixture record for one write_all are parsing/serialization-only. Manual writer ticks exist only under cfg(test), preserving production timer, durability, queue and idle-projection transitions. Existing models remain unchanged; real filesystem and scheduler behavior is implementation-tested."
bounds = "Channel-held partial JSON/UTF-8 record; malformed completed record rejected; two seats pending one explicit ordering tick with no automatic idle projection."
broken_control = "Parse a partial hook record (EOF panic); force an additional automatic idle-projection tick (ordered_commits 2 versus 1)."
checks = ["cargo test -p bboxy450-term-mux --test plugin_host", "cargo test -p bboxy450-harness-host --lib ring::writer", "make test"]

[[implementation_only]]
name = "ResourceLedgerSignalForwarding"
sources = ["scripts/resource-ledger.py"]
tests = ["scripts/test-resource-ledger.py"]
models = []
scope = "The ledger wrapper has no existing lifecycle model; real POSIX signal delivery, deferred pre-child signals, descendant forwarding and exit normalization are implementation-tested, not formally proved."
bounds = "32 forced immediately-after-spawn signals and 8 pre-child signals per suite; no sleeps as timing; 30-second hang guards only. Pending signals are deduplicated to SIGINT and SIGTERM."
broken_control = "Move handler registration after Popen and attach; the named spawn-window assertion must observe -15 instead of 143."
checks = ["python3 -I scripts/test-resource-ledger.py", "make test"]

