[[crate]]
name = "bboxy450-plugin"
status = "contract-model"
models = ["PluginActivation", "PluginHook", "PluginConnection", "PluginHostApi", "PluginHookGate", "PluginSetup", "PluginHookQueue", "PluginHookBudget", "PluginTransportLaunch", "PluginTransportProgress"]
scope = "PluginTransportLaunch fences generation/root changes and terminal completion; PluginTransportProgress requires weak fairness of the deadline and owner completion group without fairness of replies, worker availability or mutex release. Physical timings, quoting, source hashes, crypto, filesystem IO and journal replay retain implementation coverage. The persistent generation-bound overrun counter drives event skipping under PluginHookBudget; actual elapsed clocks, spans, observational ring eviction and SQLite durability remain implementation-tested. Host activation generation/source-digest contract and hook policy (subjects, ceilings, payload and block grants, delivered per PluginHook); guest execution, ABI and cryptographic implementation use fixtures. Live plugin connections are fenced by activation generation (PluginConnection); plugin-originated host requests made during a host call are admitted and answered per PluginHostApi; JSON-RPC demultiplexing uses private host fixtures. Call and hook measurements (a bounded in-memory ring per plugin, observational only, never an authority input) are implementation-tested. The models ship with the crates that own them (feature model, models/*.tla and *.cfg): PluginHook and PluginHostApi with bboxy450-plugin, PluginActivation, PluginConnection, PluginHookGate, PluginSetup and PluginHookQueue (two plugins sharing the bounded hook FIFO, written with the native checker's quantifiers, dynamic-index reads and IF updates) with bboxy450-term-mux; make test-formal fails when a shipped file drifts from its Rust builder."
